<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock — Evergreen Golf</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #181c27; --surface2: #1e2333; --surface3: #252a3a;
      --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
      --text: #e8ecf0; --muted: #7a8499; --dim: #4a5068;
      --accent: #3ddc84; --accent-dim: rgba(61,220,132,0.13);
      --red: #ff5f57; --red-dim: rgba(255,95,87,0.13);
      --amber: #ffbd2e; --amber-dim: rgba(255,189,46,0.13);
      --blue: #5b9df9; --blue-dim: rgba(91,157,249,0.13);
      --sidebar: 220px; --topbar: 60px; --r: 10px; --rs: 6px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── TOPBAR ── */
    #topBar {
      position: fixed; top: 0; left: 0; right: 0; height: var(--topbar);
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px 0 calc(var(--sidebar) + 20px); z-index: 100;
    }
    .brand { font-size: 0.82rem; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
    .brand-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    #hamburger { display: none; background: none; border: none; color: var(--text); font-size: 1.3rem; cursor: pointer; }

    /* ── SIDEBAR ── */
    #sidebar {
      position: fixed; top: 0; left: 0; width: var(--sidebar); height: 100vh;
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; z-index: 200; transition: transform 0.3s ease;
    }
    .sb-logo { height: var(--topbar); display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid var(--border); }
    .sb-icon { width: 30px; height: 30px; background: linear-gradient(135deg, var(--accent), #1aa85a); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
    .sb-title { font-size: 0.88rem; font-weight: 700; line-height: 1.2; }
    .sb-title span { display: block; font-size: 0.65rem; font-weight: 400; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .sb-nav { flex: 1; padding: 14px 8px; display: flex; flex-direction: column; gap: 2px; }
    .nav-sec { font-size: 0.62rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); padding: 10px 10px 4px; }
    .nav-link { display: flex; align-items: center; gap: 9px; padding: 8px 12px; border-radius: var(--rs); color: var(--muted); text-decoration: none; font-size: 0.86rem; font-weight: 500; transition: all 0.15s; border: none; background: none; width: 100%; cursor: pointer; font-family: inherit; }
    .nav-link:hover { background: var(--surface3); color: var(--text); }
    .nav-link.active { background: var(--accent-dim); color: var(--accent); }
    .sb-foot { padding: 10px 8px; border-top: 1px solid var(--border); }
    #sideOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 150; }
    #sideOverlay.show { display: block; }

    /* ── MAIN ── */
    #main { margin-left: var(--sidebar); margin-top: var(--topbar); padding: 26px 26px 100px; }

    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
    .page-head h1 { font-size: 1.55rem; font-weight: 700; }
    .page-head p { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    .head-btns { display: flex; gap: 8px; flex-wrap: wrap; }

    /* ── BUTTONS ── */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: var(--rs); font-size: 0.82rem; font-weight: 600; font-family: inherit; cursor: pointer; border: 1px solid transparent; transition: all 0.15s; white-space: nowrap; }
    .btn:active { transform: scale(0.97); }
    .btn-ghost { background: var(--surface2); border-color: var(--border2); color: var(--text); }
    .btn-ghost:hover { background: var(--surface3); }
    .btn-accent { background: var(--accent); color: #071a0e; font-weight: 700; }
    .btn-accent:hover { opacity: 0.88; }
    .btn-amber { background: var(--amber-dim); border-color: var(--amber); color: var(--amber); }
    .btn-red { background: var(--red-dim); border-color: var(--red); color: var(--red); }
    .btn-sm { padding: 5px 11px; font-size: 0.77rem; }

    /* ── STATS ── */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 12px; margin-bottom: 22px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 15px 17px; }
    .stat-label { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--dim); margin-bottom: 7px; }
    .stat-val { font-size: 1.45rem; font-weight: 700; font-family: 'DM Mono', monospace; }

    /* ── CATEGORY COLUMNS ── */
    #catColumns { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .cat-col {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
      padding: 13px 16px; cursor: pointer; transition: all 0.18s;
      flex: 1; min-width: 90px; max-width: 160px; user-select: none;
    }
    .cat-col:hover { border-color: var(--border2); background: var(--surface2); }
    .cat-col.active { border-color: var(--accent); background: var(--accent-dim); }
    .cat-col.active .cat-name { color: var(--accent); }
    .cat-name { font-size: 0.86rem; font-weight: 700; color: var(--text); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cat-count { font-size: 0.7rem; color: var(--muted); }

    /* ── SMART FILTER BAR ── */
    #filterBar {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
      padding: 12px 16px; margin-bottom: 14px; display: none; flex-direction: column; gap: 10px;
    }
    #filterBar.show { display: flex; }
    .filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .filter-label { font-size: 0.69rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--dim); min-width: 44px; }
    .chips-wrap { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-chip {
      padding: 4px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 600;
      font-family: inherit; cursor: pointer; border: 1px solid var(--border2);
      background: var(--surface2); color: var(--muted); transition: all 0.13s;
    }
    .filter-chip:hover { border-color: var(--accent); color: var(--text); }
    .filter-chip.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

    /* ── SEARCH ── */
    .toolbar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 15px; display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
    .sw { position: relative; flex: 1; min-width: 170px; }
    .sw-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--dim); font-size: 0.85rem; pointer-events: none; }
    .sw input { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--rs); color: var(--text); font-family: inherit; font-size: 0.84rem; padding: 8px 11px 8px 30px; outline: none; transition: border-color 0.15s; }
    .sw input::placeholder { color: var(--dim); }
    .sw input:focus { border-color: var(--accent); }

    /* ── TABLE ── */
    .tbl-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.84rem; table-layout: fixed; }
    col.col-id   { width: 52px; }
    col.col-bar  { width: 108px; }
    col.col-name { width: auto; }
    col.col-qty  { width: 76px; }
    col.col-unit { width: 60px; }
    col.col-mrp  { width: 100px; }
    col.col-hsn  { width: 108px; }
    col.col-act  { width: 126px; }

    thead tr { border-bottom: 1px solid var(--border2); }
    thead th { padding: 11px 14px; text-align: left; font-size: 0.69rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--dim); cursor: pointer; user-select: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.15s; }
    thead th:hover { color: var(--text); }
    thead th.no-sort { cursor: default; }
    thead th.no-sort:hover { color: var(--dim); }
    .si { margin-left: 4px; color: var(--accent); }

    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    tbody td { padding: 10px 14px; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    tbody td.allow-wrap { white-space: normal; }

    .c-id  { color: var(--dim); font-family: 'DM Mono', monospace; font-size: 0.75rem; }
    .c-bar { font-family: 'DM Mono', monospace; font-size: 0.78rem; color: var(--muted); }
    .c-cat { color: var(--muted); font-size: 0.78rem; }
    .c-var { font-weight: 600; }
    .c-plain { font-weight: 500; }

    .qty-badge { display: inline-flex; align-items: center; justify-content: center; background: var(--blue-dim); color: var(--blue); border-radius: 4px; padding: 2px 8px; font-family: 'DM Mono', monospace; font-weight: 600; font-size: 0.8rem; min-width: 40px; }
    .qty-badge.low { background: var(--red-dim); color: var(--red); }
    .c-mrp { font-family: 'DM Mono', monospace; font-weight: 600; }
    .gst-tag { display: inline-block; background: var(--accent-dim); color: var(--accent); border-radius: 4px; padding: 1px 6px; font-size: 0.69rem; font-weight: 600; margin-top: 2px; }

    .edit-input { background: var(--surface3); border: 1px solid var(--border2); border-radius: var(--rs); color: var(--text); font-family: inherit; font-size: 0.82rem; padding: 6px 8px; outline: none; width: 100%; transition: border-color 0.15s; }
    .edit-input:focus { border-color: var(--accent); }

    .pending-row { background: rgba(61,220,132,0.04); }
    .pending-row td:first-child { border-left: 2px solid var(--accent); }

    .center-state { padding: 60px 20px; text-align: center; color: var(--muted); }
    .spinner { display: inline-block; width: 26px; height: 26px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #exportBtn {
      position: fixed; bottom: 22px; right: 22px; z-index: 300;
      background: var(--surface); color: var(--accent); border: 1px solid var(--accent);
      padding: 10px 17px; border-radius: 50px; font-family: inherit; font-size: 0.82rem;
      font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 7px;
      box-shadow: 0 4px 20px rgba(61,220,132,0.2); transition: all 0.2s;
    }
    #exportBtn:hover { background: var(--accent); color: #071a0e; }

    @media (max-width: 768px) {
      #topBar { padding: 0 14px; }
      .brand { display: none; }
      #hamburger { display: block; }
      #sidebar { transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }
      #main { margin-left: 0; padding: 14px 12px 100px; }
      .page-head { flex-direction: column; }
      .head-btns { width: 100%; }
      .head-btns .btn { flex: 1; justify-content: center; }
      .stats { grid-template-columns: 1fr 1fr; }
      .cat-col { max-width: none; flex: 1 0 calc(50% - 5px); }
      table { min-width: 520px; }
    }
  </style>
</head>
<body>

<div id="sideOverlay"></div>

<nav id="sidebar">
  <div class="sb-logo">
    <div class="sb-icon">&#9971;</div>
    <div class="sb-title">Evergreen <span>Golf IMS</span></div>
  </div>
  <div class="sb-nav">
    <div class="nav-sec">Navigation</div>
    <a href="sales.html" class="nav-link">&#128722; Sales</a>
    <a href="./items.html" class="nav-link active">&#128230; Stock</a>
    <div class="nav-sec">Reports</div>
    <a href="reports.html" class="nav-link">&#128202; Analytics</a>
    <a href="#" class="nav-link">&#128203; Edit Log</a>
  </div>
  <div class="sb-foot">
    <button id="logoutBtn" class="nav-link btn-red" style="width:100%;">&#8617; Logout</button>
  </div>
</nav>

<header id="topBar">
  <div style="display:flex;align-items:center;gap:12px;">
    <button id="hamburger">&#9776;</button>
    <div class="brand"><span class="brand-dot"></span> Evergreen Golf &nbsp;&middot;&nbsp; Inventory</div>
  </div>
</header>

<main id="main">
  <div class="page-head">
    <div>
      <h1>Stock Overview</h1>
      <p id="subLine">Manage inventory items, pricing and HSN codes</p>
    </div>
    <div class="head-btns">
      <button id="editBtn" class="btn btn-ghost">&#9998; Enable Edit Mode</button>
      <button id="addBtn" class="btn btn-accent" style="display:none;">+ Add Item</button>
      <button id="saveAllBtn" class="btn btn-accent" style="display:none;">&#128190; Save All</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Total Items</div><div class="stat-val" id="sItems">—</div></div>
    <div class="stat"><div class="stat-label">Total Qty</div><div class="stat-val" id="sQty">—</div></div>
    <div class="stat"><div class="stat-label">Avg MRP (Rs.)</div><div class="stat-val" id="sMrp">—</div></div>
    <div class="stat"><div class="stat-label">With HSN</div><div class="stat-val" id="sHsn">—</div></div>
  </div>

  <!-- CATEGORY COLUMNS -->
  <div id="catColumns"></div>

  <!-- SMART FILTER BAR -->
  <div id="filterBar">
    <div id="sizeFilterRow" class="filter-row" style="display:none;">
      <span class="filter-label">Size</span>
      <div class="chips-wrap" id="sizeChips"></div>
    </div>
    <div id="colorFilterRow" class="filter-row" style="display:none;">
      <span class="filter-label">Color</span>
      <div class="chips-wrap" id="colorChips"></div>
    </div>
    <div id="extraFilterRow" class="filter-row" style="display:none;">
      <span class="filter-label">Other</span>
      <div class="chips-wrap" id="extraChips"></div>
    </div>
  </div>

  <!-- SEARCH BAR -->
  <div class="toolbar">
    <div class="sw"><span class="sw-icon">&#128269;</span><input type="text" id="searchName" placeholder="Search by item name..."></div>
    <div class="sw" style="max-width:200px;"><span class="sw-icon">&#128204;</span><input type="text" id="searchBarcode" placeholder="Search barcode..."></div>
  </div>

  <div class="tbl-wrap" id="container">
    <div class="center-state"><div class="spinner"></div><p>Loading stock data...</p></div>
  </div>
</main>

<button id="exportBtn">&#128202; Export CSV</button>

<script>
(function() {
  var SUPABASE_URL = "https://krveybwqyuuipenhawtx.supabase.co";
  var SUPABASE_KEY = "sb_publishable_5nif9Qruk9n0ChTqgdtoIQ_g2YHVbao";
  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var container  = document.getElementById("container");
  var editBtn    = document.getElementById("editBtn");
  var addBtn     = document.getElementById("addBtn");
  var saveAllBtn = document.getElementById("saveAllBtn");
  var searchName = document.getElementById("searchName");
  var searchBar  = document.getElementById("searchBarcode");
  var exportBtn  = document.getElementById("exportBtn");
  var logoutBtn  = document.getElementById("logoutBtn");
  var hamburger  = document.getElementById("hamburger");
  var sidebar    = document.getElementById("sidebar");
  var overlay    = document.getElementById("sideOverlay");
  var filterBar  = document.getElementById("filterBar");

  var editMode       = false;
  var stockData      = [];
  var sortCol        = -1;
  var sortDir        = 1;
  var hsnMap         = {};
  var activeCategory = null; // null = All
  var activeSize     = null;
  var activeColor    = null;
  var activeExtra    = null;

  // Known token lists — order matters (longer/specific first for sizes)
  var SIZE_TOKENS = [
    "XXXL","XXL","XL","XS","XXS","2XL","3XL",
    "S","M","L",
    "6","7","8","8.5","9","9.5","10","10.5","11","11.5","12","13","14","15",
    "24","26","28","30","32","34","36","38","40","42","44","46","48"
  ];
  var COLOR_TOKENS = [
    "white","black","red","blue","green","yellow","orange","pink","purple",
    "grey","gray","navy","brown","beige","cream","gold","silver","maroon",
    "cyan","teal","lime","violet","indigo","khaki","olive","coral","turquoise","charcoal"
  ];
  var SKIP_WORDS = new Set([
    "and","the","with","for","pack","set","piece","pcs","pair","box","bag","kit",
    "no","yes","golf","evergreen","pro","premium","standard","regular","classic","new","style"
  ]);

  hamburger.onclick = function() { sidebar.classList.toggle("open"); overlay.classList.toggle("show"); };
  overlay.onclick   = function() { sidebar.classList.remove("open"); overlay.classList.remove("show"); };
  logoutBtn.onclick = function() { db.auth.signOut().then(function() { window.location.href = "Login.html"; }); };

  // ── HSN LOADER ──
  function loadHsn() {
    fetch(SUPABASE_URL + "/storage/v1/object/public/Pub/hsn4_gst_rates.csv")
      .then(function(r) { return r.ok ? r.text() : ""; })
      .then(function(text) {
        if (!text) return;
        text.trim().split("\n").slice(1).forEach(function(line) {
          var cols = [], cur = "", inQ = false;
          for (var j = 0; j < line.length; j++) {
            var ch = line[j];
            if (ch === '"') inQ = !inQ;
            else if (ch === ',' && !inQ) { cols.push(cur); cur = ""; }
            else cur += ch;
          }
          cols.push(cur);
          if (cols[0] && cols[0].trim()) hsnMap[cols[0].trim()] = (cols[2] || "").trim() || "N/A";
        });
      }).catch(function() {});
  }

  // ── FETCH ──
  function fetchData() {
    db.from("Stock").select("*").order("ID", { ascending: true })
      .then(function(result) {
        if (result.error) {
          container.innerHTML = '<div class="center-state"><p style="color:var(--red)">Error: ' + result.error.message + '</p></div>';
          return;
        }
        stockData = result.data || [];
        updateStats();
        buildCategoryColumns();
        buildSmartFilters(activeCategory);
        renderTable();
      }).catch(function(e) {
        container.innerHTML = '<div class="center-state"><p style="color:var(--red)">Error: ' + e.message + '</p></div>';
      });
  }

  // ── STATS ──
  function updateStats() {
    document.getElementById("sItems").textContent = stockData.length;
    var qty = stockData.reduce(function(s, r) { return s + (parseFloat(r.QTY) || 0); }, 0);
    document.getElementById("sQty").textContent = qty % 1 ? qty.toFixed(1) : qty;
    var mrps = stockData.map(function(r) { return parseFloat(r.MRP); }).filter(function(n) { return !isNaN(n) && n > 0; });
    var avg = mrps.length ? mrps.reduce(function(a, b) { return a + b; }, 0) / mrps.length : 0;
    document.getElementById("sMrp").textContent = avg ? avg.toFixed(0) : "N/A";
    document.getElementById("sHsn").textContent = stockData.filter(function(r) { return r.HSN && String(r.HSN).trim(); }).length;
  }

  // ── PARSE NAME ──
  // "Balls: Titleist White" → { category: "Balls", variant: "Titleist White" }
  function parseName(name) {
    if (!name) return { category: "Uncategorised", variant: "" };
    var idx = name.indexOf(":");
    if (idx === -1) return { category: "Uncategorised", variant: name.trim() };
    return { category: name.slice(0, idx).trim(), variant: name.slice(idx + 1).trim() };
  }

  // ── BUILD CATEGORY COLUMNS ──
  function buildCategoryColumns() {
    var catMap = {};
    stockData.forEach(function(r) {
      var cat = parseName(r.Item_Name).category;
      catMap[cat] = (catMap[cat] || 0) + 1;
    });
    var cats = Object.keys(catMap).sort();
    var el = document.getElementById("catColumns");
    el.innerHTML = "";

    // All pill
    var allDiv = document.createElement("div");
    allDiv.className = "cat-col" + (activeCategory === null ? " active" : "");
    allDiv.innerHTML = '<div class="cat-name">All</div><div class="cat-count">' + stockData.length + ' items</div>';
    allDiv.onclick = function() { setCategory(null); };
    el.appendChild(allDiv);

    cats.forEach(function(cat) {
      var div = document.createElement("div");
      div.className = "cat-col" + (activeCategory === cat ? " active" : "");
      div.innerHTML = '<div class="cat-name">' + esc(cat) + '</div><div class="cat-count">' + catMap[cat] + ' items</div>';
      div.onclick = (function(c) { return function() { setCategory(c); }; })(cat);
      el.appendChild(div);
    });
  }

  // ── SET CATEGORY ──
  function setCategory(cat) {
    activeCategory = cat;
    activeSize  = null;
    activeColor = null;
    activeExtra = null;
    buildCategoryColumns();
    buildSmartFilters(cat);
    renderTable();
  }

  // ── SMART FILTERS ──
  function buildSmartFilters(cat) {
    filterBar.classList.remove("show");
    document.getElementById("sizeFilterRow").style.display  = "none";
    document.getElementById("colorFilterRow").style.display = "none";
    document.getElementById("extraFilterRow").style.display = "none";
    if (!cat) return;

    var items = stockData.filter(function(r) { return parseName(r.Item_Name).category === cat; });
    var variants = items.map(function(r) { return parseName(r.Item_Name).variant; });

    // ── SIZES: check for size tokens as whole words/tokens ──
    var foundSizes = [];
    SIZE_TOKENS.forEach(function(sz) {
      var re = new RegExp("(^|[\\s\\-\\/,])" + sz.replace(".", "\\.") + "([\\s\\-\\/,]|$)", "i");
      var found = variants.some(function(v) { return re.test(v); });
      if (found) foundSizes.push(sz);
    });

    // ── COLORS: match whole words ──
    var foundColors = [];
    COLOR_TOKENS.forEach(function(col) {
      var re = new RegExp("(^|\\s)" + col + "(\\s|$)", "i");
      var found = variants.some(function(v) { return re.test(v); });
      if (found) foundColors.push(col.charAt(0).toUpperCase() + col.slice(1));
    });

    // ── EXTRAS: frequent words not already in sizes/colors ──
    var skipSet = new Set(SIZE_TOKENS.map(function(s){ return s.toLowerCase(); })
      .concat(COLOR_TOKENS)
      .concat(Array.from(SKIP_WORDS)));
    var wordCount = {};
    variants.forEach(function(v) {
      v.split(/[\s\-\/,]+/).forEach(function(word) {
        var w = word.toLowerCase().replace(/[^a-z0-9]/g, "");
        if (w.length > 1 && !skipSet.has(w)) wordCount[w] = (wordCount[w] || 0) + 1;
      });
    });
    var foundExtras = Object.keys(wordCount)
      .filter(function(w) { return wordCount[w] > 1; })
      .sort(function(a, b) { return wordCount[b] - wordCount[a]; })
      .slice(0, 20)
      .map(function(w) { return w.charAt(0).toUpperCase() + w.slice(1); });

    var hasAny = foundSizes.length || foundColors.length || foundExtras.length;
    if (!hasAny) return;
    filterBar.classList.add("show");

    if (foundSizes.length) {
      document.getElementById("sizeFilterRow").style.display = "flex";
      renderChips("sizeChips", foundSizes, activeSize, function(v) { activeSize = v; buildSmartFilters(cat); renderTable(); });
    }
    if (foundColors.length) {
      document.getElementById("colorFilterRow").style.display = "flex";
      renderChips("colorChips", foundColors, activeColor, function(v) { activeColor = v; buildSmartFilters(cat); renderTable(); });
    }
    if (foundExtras.length) {
      document.getElementById("extraFilterRow").style.display = "flex";
      renderChips("extraChips", foundExtras, activeExtra, function(v) { activeExtra = v; buildSmartFilters(cat); renderTable(); });
    }
  }

  function renderChips(containerId, values, activeVal, onSelect) {
    var el = document.getElementById(containerId);
    el.innerHTML = "";

    function chip(label, isActive, onClick) {
      var btn = document.createElement("button");
      btn.className = "filter-chip" + (isActive ? " active" : "");
      btn.textContent = label;
      btn.onclick = onClick;
      el.appendChild(btn);
    }

    chip("All", activeVal === null, function() { onSelect(null); });
    values.forEach(function(val) {
      chip(val, activeVal === val, function() { onSelect(activeVal === val ? null : val); });
    });
  }

  // ── SORT ──
  window._sort = function(col) {
    sortDir = (sortCol === col) ? sortDir * -1 : 1;
    sortCol = col;
    renderTable();
  };

  // ── RENDER TABLE ──
  function renderTable() {
    var nt = searchName.value.toLowerCase();
    var bt = searchBar.value.toLowerCase();

    var filtered = stockData.filter(function(r) {
      var parsed = parseName(r.Item_Name);

      if (activeCategory !== null && parsed.category !== activeCategory) return false;

      var variant = parsed.variant;

      if (activeSize) {
        var szRe = new RegExp("(^|[\\s\\-\\/,])" + activeSize.replace(".", "\\.") + "([\\s\\-\\/,]|$)", "i");
        if (!szRe.test(variant)) return false;
      }
      if (activeColor) {
        var colRe = new RegExp("(^|\\s)" + activeColor + "(\\s|$)", "i");
        if (!colRe.test(variant)) return false;
      }
      if (activeExtra) {
        if (variant.toLowerCase().indexOf(activeExtra.toLowerCase()) === -1) return false;
      }

      if (nt && (r.Item_Name || "").toLowerCase().indexOf(nt) === -1) return false;
      if (bt && String(r.Barcode || "").toLowerCase().indexOf(bt) === -1) return false;

      return true;
    });

    // Sort
    if (sortCol !== -1) {
      var keys = ["ID", "Barcode", "Item_Name", "QTY", "Unit", "MRP", "HSN"];
      filtered.sort(function(a, b) {
        var A = a[keys[sortCol]] != null ? a[keys[sortCol]] : "";
        var B = b[keys[sortCol]] != null ? b[keys[sortCol]] : "";
        if (typeof A === "number" && typeof B === "number") return (A - B) * sortDir;
        return A.toString().localeCompare(B.toString()) * sortDir;
      });
    }

    // Sub line
    var label = activeCategory ? activeCategory : "All categories";
    document.getElementById("subLine").textContent = filtered.length + " items · " + label;

    if (!filtered.length) {
      container.innerHTML = '<div class="center-state"><p>No items found</p></div>';
      return;
    }

    var actionTh = editMode ? '<th class="no-sort">Actions</th>' : "";
    var colAct   = editMode ? '<col class="col-act">' : "";

    var html = '<table>' +
      '<colgroup><col class="col-id"><col class="col-bar"><col class="col-name"><col class="col-qty"><col class="col-unit"><col class="col-mrp"><col class="col-hsn">' + colAct + '</colgroup>' +
      '<thead><tr>' +
      '<th onclick="window._sort(0)">ID<span class="si"></span></th>' +
      '<th onclick="window._sort(1)">Barcode<span class="si"></span></th>' +
      '<th onclick="window._sort(2)">Item Name<span class="si"></span></th>' +
      '<th onclick="window._sort(3)">Qty<span class="si"></span></th>' +
      '<th onclick="window._sort(4)">Unit<span class="si"></span></th>' +
      '<th onclick="window._sort(5)">Price (Rs.)<span class="si"></span></th>' +
      '<th onclick="window._sort(6)">HSN / GST<span class="si"></span></th>' +
      actionTh + '</tr></thead><tbody>';

    for (var i = 0; i < filtered.length; i++) {
      var row = filtered[i];
      var parsed = parseName(row.Item_Name);
      var qty = parseFloat(row.QTY) || 0;

      if (editMode) {
        html += '<tr data-id="' + row.ID + '">' +
          '<td class="c-id">' + row.ID + '</td>' +
          '<td><input class="edit-input" data-key="Barcode" value="' + esc(row.Barcode || "") + '"></td>' +
          '<td><input class="edit-input" data-key="Item_Name" value="' + esc(row.Item_Name || "") + '"></td>' +
          '<td><input class="edit-input" data-key="QTY" type="number" step="0.01" value="' + qty + '"></td>' +
          '<td><input class="edit-input" data-key="Unit" value="' + esc(row.Unit || "Pcs") + '"></td>' +
          '<td><input class="edit-input" data-key="MRP" type="number" value="' + (row.MRP || 0) + '"></td>' +
          '<td><input class="edit-input" data-key="HSN" value="' + esc(row.HSN || "") + '" data-hsnid="' + row.ID + '">' +
          '<div id="gst_' + row.ID + '">' + gstBadge(row.HSN) + '</div></td>' +
          '<td style="white-space:nowrap;">' +
          '<button class="btn btn-accent btn-sm" onclick="window._save(this)">Save</button> ' +
          '<button class="btn btn-red btn-sm" onclick="window._del(this)">Del</button></td></tr>';
      } else {
        // Name cell: dim the category prefix, bold the variant
        var nameHtml;
        if (parsed.category !== "Uncategorised" && parsed.variant) {
          nameHtml = '<span class="c-cat">' + esc(parsed.category) + ':&nbsp;</span><span class="c-var">' + esc(parsed.variant) + '</span>';
        } else {
          nameHtml = '<span class="c-plain">' + esc(row.Item_Name || "") + '</span>';
        }

        var qtyClass = qty <= 0 ? "qty-badge low" : (qty <= 3 ? "qty-badge low" : "qty-badge");

        html += '<tr>' +
          '<td class="c-id">' + row.ID + '</td>' +
          '<td class="c-bar">' + esc(row.Barcode || "") + '</td>' +
          '<td class="allow-wrap">' + nameHtml + '</td>' +
          '<td><span class="' + qtyClass + '">' + qty + '</span></td>' +
          '<td style="color:var(--muted)">' + esc(row.Unit || "Pcs") + '</td>' +
          '<td class="c-mrp">Rs.' + Number(row.MRP || 0).toLocaleString() + '</td>' +
          '<td>' + (row.HSN || '<span style="color:var(--dim)">N/A</span>') + gstBadge(row.HSN) + '</td>' +
          '</tr>';
      }
    }

    html += '</tbody></table>';
    container.innerHTML = html;

    if (editMode) {
      var hsnInputs = container.querySelectorAll('[data-hsnid]');
      for (var k = 0; k < hsnInputs.length; k++) {
        (function(inp) {
          inp.addEventListener('input', function() {
            var id = inp.getAttribute('data-hsnid');
            var div = document.getElementById('gst_' + id);
            if (div) div.innerHTML = gstBadge(inp.value.trim());
          });
        })(hsnInputs[k]);
      }
    }

    updateSortIndicators();
  }

  function gstBadge(hsn) {
    if (!hsn || !hsnMap[String(hsn).trim()]) return "";
    return '<div class="gst-tag">GST ' + hsnMap[String(hsn).trim()] + '%</div>';
  }

  function updateSortIndicators() {
    var spans = container.querySelectorAll(".si");
    for (var i = 0; i < spans.length; i++) {
      spans[i].textContent = i === sortCol ? (sortDir === 1 ? " ▲" : " ▼") : "";
    }
  }

  function esc(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ── SAVE ──
  window._save = function(btn) {
    var tr = btn.closest("tr");
    var id = tr.getAttribute("data-id");
    var up = {};
    var inputs = tr.querySelectorAll(".edit-input");
    for (var i = 0; i < inputs.length; i++) {
      var k = inputs[i].getAttribute("data-key");
      if (k) up[k] = (k === "QTY" || k === "MRP") ? Number(inputs[i].value) : inputs[i].value.trim();
    }
    btn.textContent = "Saving..."; btn.disabled = true;
    db.from("Stock").update(up).eq("ID", id).then(function(result) {
      if (result.error) {
        btn.textContent = "Error!"; btn.style.background = "var(--red)";
        setTimeout(function() { btn.textContent = "Save"; btn.disabled = false; btn.style.background = ""; }, 2000);
      } else {
        var orig = null;
        for (var i = 0; i < stockData.length; i++) { if (stockData[i].ID == id) { orig = stockData[i]; break; } }
        var log = [];
        ["MRP","Item_Name","QTY"].forEach(function(key) {
          var old = (key === "QTY" || key === "MRP") ? Number(orig[key]) : (orig[key] || "").trim();
          if (old !== up[key]) log.push(key + ":(" + old + "->" + up[key] + ")");
        });
        if (log.length) db.from("Edits").insert([{ barcode: orig.Barcode, item_name: up.Item_Name || orig.Item_Name, changes: log.join(", "), action: "UPDATE" }]);
        btn.textContent = "Saved!";
        setTimeout(function() { fetchData(); }, 800);
      }
    });
  };

  // ── DELETE ──
  window._del = function(btn) {
    if (!confirm("Delete this item?")) return;
    var tr = btn.closest("tr");
    var id = tr.getAttribute("data-id");
    var row = null;
    for (var i = 0; i < stockData.length; i++) { if (stockData[i].ID == id) { row = stockData[i]; break; } }
    db.from("Edits").insert([{ barcode: row.Barcode, item_name: row.Item_Name, changes: "Item deleted", action: "DELETE" }]);
    db.from("Stock").delete().eq("ID", id).then(function() { fetchData(); });
  };

  // ── EDIT MODE ──
  editBtn.onclick = function() {
    editMode = !editMode;
    editBtn.textContent = editMode ? "Exit Edit Mode" : "Enable Edit Mode";
    editBtn.className   = editMode ? "btn btn-amber" : "btn btn-ghost";
    addBtn.style.display     = editMode ? "inline-flex" : "none";
    saveAllBtn.style.display = editMode ? "inline-flex" : "none";
    renderTable();
  };

  addBtn.onclick = function() {
    var tbody = container.querySelector("tbody");
    if (!tbody) return;
    var tr = document.createElement("tr");
    tr.className = "pending-row";
    tr.innerHTML =
      '<td class="c-id" style="color:var(--accent)">New</td>' +
      '<td><input type="text" class="edit-input nBar" placeholder="Barcode"></td>' +
      '<td><input type="text" class="edit-input nNam" placeholder="Category: Variant"></td>' +
      '<td><input type="number" step="0.01" class="edit-input nQty" placeholder="0"></td>' +
      '<td><input type="text" class="edit-input nUni" value="Pcs"></td>' +
      '<td><input type="number" class="edit-input nMrp" placeholder="0"></td>' +
      '<td><input type="text" class="edit-input nHsn" placeholder="HSN"></td>' +
      '<td><button class="btn btn-red btn-sm" onclick="this.closest(\'tr\').remove()">Cancel</button></td>';
    tbody.prepend(tr);
    tr.querySelector(".nBar").focus();
  };

  saveAllBtn.onclick = function() {
    var rows = container.querySelectorAll(".pending-row");
    if (!rows.length) { alert("No pending rows. Click '+ Add Item' first."); return; }
    var payloads = [], valid = true;
    for (var i = 0; i < rows.length; i++) {
      var b = rows[i].querySelector(".nBar").value.trim();
      var n = rows[i].querySelector(".nNam").value.trim();
      if (!b || !n) { valid = false; break; }
      payloads.push({
        Barcode: b, Item_Name: n,
        QTY: parseFloat(rows[i].querySelector(".nQty").value) || 0,
        Unit: rows[i].querySelector(".nUni").value.trim(),
        MRP: parseFloat(rows[i].querySelector(".nMrp").value) || 0,
        HSN: rows[i].querySelector(".nHsn").value.trim()
      });
    }
    if (!valid) { alert("Fill Barcode and Item Name for all rows."); return; }
    saveAllBtn.textContent = "Saving..."; saveAllBtn.disabled = true;
    db.from("Stock").insert(payloads).then(function(result) {
      if (result.error) { alert("Error: " + result.error.message); }
      else { fetchData(); }
      saveAllBtn.textContent = "Save All"; saveAllBtn.disabled = false;
    });
  };

  // ── EXPORT ──
  exportBtn.onclick = function() {
    var csv = "ID,Barcode,Item Name,Quantity,Price(INR),HSN\n";
    stockData.forEach(function(r) {
      csv += r.ID + ',"=""' + r.Barcode + '""","' + (r.Item_Name || "") + '",' + r.QTY + ',' + r.MRP + ',"' + (r.HSN || "") + '"\n';
    });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = "Evergreen_Stock_" + new Date().toLocaleDateString("en-IN") + ".csv";
    a.click();
  };

  searchName.oninput = renderTable;
  searchBar.oninput  = renderTable;

  loadHsn();
  fetchData();
})();
</script>
</body>
</html>
