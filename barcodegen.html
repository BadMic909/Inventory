<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcode Generator — Evergreen Golf</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1108;
    --surface: #181a10;
    --border: #2a2e1a;
    --accent: #b8f53a;
    --text: #e8ecda;
    --text-muted: #7a8060;
    --danger: #f53a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; }

  header {
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex; align-items: center; gap: 14px;
  }
  .logo { width: 28px; height: 28px; background: var(--accent); border-radius: 3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  header h1 { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; }
  header p { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

  main { max-width: 560px; margin: 0 auto; padding: 32px 24px 120px; }

  .mono-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted);
  }

  /* Table-like header */
  .col-header {
    display: grid; grid-template-columns: 1fr 130px 36px;
    padding: 0 0 6px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0;
  }
  .col-header span {
    font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted);
    padding: 0 14px;
  }
  .col-header span:nth-child(2) { text-align: center; border-left: 1px solid var(--border); }

  /* Entries list — no gaps, bordered rows */
  .entries { display: flex; flex-direction: column; }

  .entry-row {
    display: grid; grid-template-columns: 1fr 130px 36px;
    align-items: stretch;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .entry-row:hover { background: #1d2012; }
  .entry-row:focus-within { background: #1d2012; }

  .entry-row input {
    background: transparent; border: none; outline: none;
    color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 13px;
    width: 100%; padding: 10px 14px;
  }
  .entry-row input::placeholder { color: #3a3e28; }
  .entry-row input[type=number] {
    -moz-appearance: textfield; text-align: center;
    border-left: 1px solid var(--border);
  }
  .entry-row input[type=number]::-webkit-outer-spin-button,
  .entry-row input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

  .del-btn {
    background: none; border: none; border-left: 1px solid var(--border);
    color: var(--text-muted); cursor: pointer; font-size: 14px;
    transition: color 0.15s, background 0.15s;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .del-btn:hover { color: var(--danger); background: rgba(245,58,58,0.06); }

  /* Outer border wrapping the table */
  .table-wrap {
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 0;
  }
  .table-wrap .entry-row:last-child { border-bottom: none; }

  .add-btn {
    width: 100%; background: none;
    border: 1px solid var(--border); border-top: none;
    border-radius: 0 0 6px 6px;
    color: var(--text-muted); font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; padding: 10px; cursor: pointer;
    transition: all 0.15s; letter-spacing: 0.05em;
    margin-bottom: 24px;
  }
  .add-btn:hover { background: #1d2012; color: var(--accent); }

  /* Summary */
  .summary-row {
    display: flex; gap: 8px; margin-bottom: 16px;
  }
  .summary-card {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 14px 18px;
  }
  .summary-card .val {
    font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 700;
    color: var(--accent); line-height: 1;
  }
  .summary-card .lbl {
    font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 600;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted);
    margin-top: 4px;
  }

  .gen-btn {
    width: 100%; background: var(--accent); color: var(--bg);
    border: none; border-radius: 6px;
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 700;
    letter-spacing: 0.06em; padding: 15px;
    cursor: pointer; transition: opacity 0.15s, transform 0.1s;
  }
  .gen-btn:hover:not(:disabled) { opacity: 0.85; transform: translateY(-1px); }
  .gen-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .toast {
    position: fixed; top: 20px; right: 20px;
    background: var(--accent); color: var(--bg);
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 700;
    padding: 10px 18px; border-radius: 6px;
    transform: translateY(-60px); opacity: 0;
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1); z-index: 999;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  #svgTemp { position: absolute; left: -9999px; visibility: hidden; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
      <rect x="1" y="2" width="2" height="14" fill="#0f1108"/>
      <rect x="4" y="2" width="1" height="14" fill="#0f1108"/>
      <rect x="6" y="2" width="3" height="14" fill="#0f1108"/>
      <rect x="10" y="2" width="1" height="14" fill="#0f1108"/>
      <rect x="12" y="2" width="2" height="14" fill="#0f1108"/>
      <rect x="15" y="2" width="2" height="14" fill="#0f1108"/>
    </svg>
  </div>
  <div>
    <h1>BARCODE GENERATOR</h1>
    <p>Evergreen Golf — 50 labels per page · 5×10 · A4</p>
  </div>
</header>

<main>
  <p class="mono-label" style="margin-bottom:10px;">Barcodes to Print</p>

  <div class="col-header">
    <span>Barcode</span>
    <span>Quantity</span>
    <span></span>
  </div>

  <div class="table-wrap">
    <div class="entries" id="entriesList"></div>
  </div>
  <button class="add-btn" id="addBtn">+ Add Barcode</button>

  <div class="summary-row">
    <div class="summary-card">
      <div class="val" id="totalCount">0</div>
      <div class="lbl">Total Labels</div>
    </div>
    <div class="summary-card">
      <div class="val" id="pagesCount">0</div>
      <div class="lbl">Pages (50/page)</div>
    </div>
  </div>

  <button class="gen-btn" id="genBtn" disabled>⬇ Download PDF</button>
</main>

<div class="toast" id="toast"></div>
<svg id="svgTemp" xmlns="http://www.w3.org/2000/svg"></svg>

<script>
let entries = [];

function addEntry(barcode = '', qty = '') {
  entries.push({ barcode, qty });
  renderEntries();
  setTimeout(() => {
    const inputs = document.querySelectorAll('.entry-row input[data-f="barcode"]');
    if (inputs.length) inputs[inputs.length - 1].focus();
  }, 30);
}

function removeEntry(i) {
  entries.splice(i, 1);
  renderEntries();
}

function renderEntries() {
  const list = document.getElementById('entriesList');
  list.innerHTML = '';
  entries.forEach((entry, i) => {
    const row = document.createElement('div');
    row.className = 'entry-row';
    row.innerHTML = `
      <input type="text" placeholder="CG-000001" value="${entry.barcode}" data-i="${i}" data-f="barcode" autocomplete="off">
      <input type="number" placeholder="qty" min="1" value="${entry.qty}" data-i="${i}" data-f="qty">
      <button class="del-btn" data-i="${i}">✕</button>
    `;
    list.appendChild(row);
  });

  list.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', e => {
      const i = parseInt(e.target.dataset.i);
      const f = e.target.dataset.f;
      if (f === 'barcode') entries[i].barcode = e.target.value.trim();
      if (f === 'qty') entries[i].qty = e.target.value;
      updateSummary();
    });
  });

  list.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', e => removeEntry(parseInt(e.target.dataset.i)));
  });

  updateSummary();
}

function updateSummary() {
  const total = entries.reduce((s, e) => s + (parseInt(e.qty) || 0), 0);
  const pages = total > 0 ? Math.ceil(total / 50) : 0;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('pagesCount').textContent = pages;
  document.getElementById('genBtn').disabled = total === 0;
}

document.getElementById('addBtn').onclick = () => addEntry();

document.getElementById('genBtn').onclick = async () => {
  const btn = document.getElementById('genBtn');
  btn.textContent = '⏳ Generating...';
  btn.disabled = true;
  await new Promise(r => setTimeout(r, 40));

  try {
    const allLabels = [];
    for (const e of entries) {
      if (!e.barcode) continue;
      const qty = parseInt(e.qty) || 0;
      for (let i = 0; i < qty; i++) allLabels.push(e.barcode);
    }
    if (!allLabels.length) { showToast('No labels to generate'); btn.textContent = '⬇ Download PDF'; btn.disabled = false; return; }

    const COLS = 5, ROWS = 10, SLOTS = 50;
    const MX = 5, MY = 5, GX = 2, GY = 2;
    const LW = (210 - 2*MX - (COLS-1)*GX) / COLS;
    const LH = (297 - 2*MY - (ROWS-1)*GY) / ROWS;
    const PAD = 1.5, TH = 4;

    const svgEl = document.getElementById('svgTemp');
    const imgCache = {};
    for (const code of [...new Set(allLabels)]) {
      JsBarcode(svgEl, code, { format: 'CODE128', displayValue: false, margin: 0, width: 2, height: 80, background: '#ffffff', lineColor: '#000000' });
      const svgStr = new XMLSerializer().serializeToString(svgEl);
      const url = URL.createObjectURL(new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' }));
      imgCache[code] = await new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          c.width = img.naturalWidth || 300; c.height = img.naturalHeight || 80;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0);
          res(c.toDataURL('image/png'));
          URL.revokeObjectURL(url);
        };
        img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('load fail')); };
        img.src = url;
      });
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const totalPages = Math.ceil(allLabels.length / SLOTS);

    for (let pg = 0; pg < totalPages; pg++) {
      if (pg > 0) doc.addPage();
      const pageLabels = allLabels.slice(pg * SLOTS, (pg + 1) * SLOTS);
      for (let idx = 0; idx < pageLabels.length; idx++) {
        const code = pageLabels[idx];
        const col = idx % COLS, row = Math.floor(idx / COLS);
        const x = MX + col * (LW + GX);
        const y = MY + row * (LH + GY);
        const bcW = LW - PAD;
        const bcH = (LH - TH - 3*PAD) * 0.78;
        const bcX = x + (LW - bcW) / 2;
        const bcY = y + TH + PAD + ((LH - TH - 2*PAD) - bcH) / 2;
        doc.addImage(imgCache[code], 'PNG', bcX, bcY, bcW, bcH);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(5);
        doc.setTextColor(0,0,0);
        doc.text(code, x + LW/2, y + LH - PAD*0.5, { align: 'center' });
      }
    }

    doc.save(`barcodes_${new Date().toISOString().slice(0,10)}.pdf`);
    showToast(`✓ ${allLabels.length} labels · ${totalPages} page${totalPages>1?'s':''}`);
  } catch(err) {
    console.error(err);
    showToast('Error: ' + err.message);
  }

  btn.textContent = '⬇ Download PDF';
  updateSummary();
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

addEntry();
</script>
</body>
</html>
