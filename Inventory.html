<!DOCTYPE html>
<html>
<head>
  <title>Stock</title>
  <link rel="stylesheet" href="./index.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <style>
    th { cursor: pointer; user-select: none; }
    .sort-indicator { font-size: 12px; margin-left: 6px; opacity: 0.6; }
    .search-row { display: flex; gap: 10px; margin: 10px 0; }
    .search-row input { padding: 8px; width: 250px; border-radius: 6px; border: 1px solid #ccc; }
    .saveRowBtn { background: #27ae60; color: white; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; margin-left: 5px; }
  </style>
</head>

<body>
<div id="mainContent">
  <h1>Stock Overview</h1>
  <button id="editToggleBtn">Enable Edit Mode</button>
  <button id="addItemBtn" style="display:none;">Add New Item</button>
  <button id="saveAllBtn" style="display:none;">Save All</button>
  <br>
  <div class="search-row">
    <input type="text" id="searchName" placeholder="Search by Item Name...">
    <input type="text" id="searchBarcode" placeholder="Search by Barcode...">
  </div>
  <div id="stockContainer"></div>
</div>

<button id="downloadCsvBtn" style="position: fixed; bottom: 20px; left: 20px; z-index: 2000; background: #1f7a44; color: white; padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
  📊 Export Stock to Excel (CSV)
</button>

<nav id="topBar"><h2>Evergreen Golf Inventory Management System</h2></nav>
<nav id="rightSidebar">
  <ul>
    <li id="red"><button id="logoutBtn">Logout</button></li>
    <li><a href="sales.html">Sales</a></li>
    <li class="active"><a href="./items.html">Stock</a></li>
  </ul>
</nav>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const SUPABASE_URL = "https://krveybwqyuuipenhawtx.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_5nif9Qruk9n0ChTqgdtoIQ_g2YHVbao";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // --- SESSION CHECK ---
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.href = "Login.html";
    return;
  }

  // --- ELEMENTS ---
  const container = document.getElementById("stockContainer");
  const editBtn = document.getElementById("editToggleBtn");
  const addBtn = document.getElementById("addItemBtn");
  const searchName = document.getElementById("searchName");
  const searchBarcode = document.getElementById("searchBarcode");
  const downloadBtn = document.getElementById("downloadCsvBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  let editMode = false;
  let stockData = [];
  let currentSortColumn = -1;
  let currentSortDirection = 1;
let hsnGstMap = {};

async function loadHsnData() {
  try {
    const res = await fetch("https://krveybwqyuuipenhawtx.supabase.co/storage/v1/object/public/Pub/hsn4_gst_rates.csv");
    const text = await res.text();
    const lines = text.trim().split("\n").slice(1);
    lines.forEach(line => {
      // Handle quoted fields with commas inside
      const cols = [];
      let current = "";
      let inQuotes = false;
      for (let char of line) {
        if (char === '"') { inQuotes = !inQuotes; }
        else if (char === ',' && !inQuotes) { cols.push(current); current = ""; }
        else { current += char; }
      }
      cols.push(current);
      const hsn = cols[0]?.trim();
      const gst = cols[2]?.trim();
      if (hsn) hsnGstMap[hsn] = gst || "N/A";
    });
  } catch(e) {
    console.error("Failed to load HSN data", e);
  }
}
  // --- LOGOUT ---
  if (logoutBtn) {
    logoutBtn.onclick = async () => {
      await supabase.auth.signOut();
      window.location.href = "Login.html";
    };
  }

  // --- FETCH ---
  async function fetchData() {
    const { data } = await supabase.from("Stock").select("*").order('ID', { ascending: true });
    stockData = data || [];
  }

  // --- RENDER TABLE ---
  function renderTable() {
    container.innerHTML = "";

    const nameTerm = searchName.value.toLowerCase();
    const barcodeTerm = searchBarcode.value.toLowerCase();

    let filteredData = stockData.filter(item => {
      const name = (item.Item_Name || "").toLowerCase();
      const barcode = String(item.Barcode || "").toLowerCase();
      return name.includes(nameTerm) && barcode.includes(barcodeTerm);
    });

    if (currentSortColumn !== -1) {
      filteredData.sort((a, b) => {
        let keys = ["ID", "Barcode", "Item_Name", "QTY", "Unit", "MRP","HSN"];
        let A = a[keys[currentSortColumn]] ?? "";
        let B = b[keys[currentSortColumn]] ?? "";
        if (typeof A === "number" && typeof B === "number") return (A - B) * currentSortDirection;
        return A.toString().localeCompare(B.toString()) * currentSortDirection;
      });
    }

    const table = document.createElement("table");
    table.classList.add("stockTable");
    table.innerHTML = `
      <thead>
        <tr>
          <th onclick="sortTable(0)">ID <span class="sort-indicator"></span></th>
          <th onclick="sortTable(1)">Barcode <span class="sort-indicator"></span></th>
          <th onclick="sortTable(2)">Item Name <span class="sort-indicator"></span></th>
          <th onclick="sortTable(3)">Qty <span class="sort-indicator"></span></th>
          <th onclick="sortTable(4)">Unit <span class="sort-indicator"></span></th>
          <th onclick="sortTable(5)">Price(₹) <span class="sort-indicator"></span></th>
          <th onclick="sortTable(6)">HSN <span class="sort-indicator"></span></th>
          ${editMode ? "<th>Actions</th>" : ""}
        </tr>
      </thead>
      <tbody></tbody>
    `;

    const tbody = table.querySelector("tbody");

 filteredData.forEach(row => {
  const tr = document.createElement("tr");
  tr.dataset.id = row.ID;

  if (editMode) {
    tr.innerHTML = `
      <td>${row.ID}</td>
      <td><input class="edit-input" data-key="Barcode" value="${row.Barcode || ''}"></td>
      <td><input class="edit-input" data-key="Item_Name" value="${row.Item_Name || ''}"></td>
      <td><input class="edit-input" data-key="QTY" type="number" step="0.01" value="${row.QTY || 0}"></td>
      <td><input class="edit-input" data-key="Unit" value="${row.Unit || 'Pcs'}"></td>
      <td><input class="edit-input" data-key="MRP" type="text" value="${row.MRP || 0}"></td>
      <td>
  <input class="edit-input" data-key="HSN" value="${row.HSN || ''}" id="hsn_${row.ID}">
  <small id="gst_${row.ID}" style="color:#27ae60;font-weight:600;">
    ${row.HSN && hsnGstMap[row.HSN] ? `GST: ${hsnGstMap[row.HSN]}%` : ''}
  </small>
</td>
      <td class="actionsCell">
        <button class="saveRowBtn">Save</button>
        <button class="deleteBtn">Delete</button>
      </td>
    `;

tr.querySelector(".saveRowBtn").onclick = async () => {
  const saveBtn = tr.querySelector(".saveRowBtn");
  const up = {};
  tr.querySelectorAll(".edit-input").forEach(input => {
    const k = input.dataset.key;
    up[k] = (k === 'QTY' || k === 'MRP') ? Number(input.value) : input.value.trim();
  });

  saveBtn.textContent = "Saving...";
  saveBtn.disabled = true;
  saveBtn.style.background = "#f39c12";

  const { error } = await supabase.from("Stock").update(up).eq("ID", tr.dataset.id);

  if (error) {
    saveBtn.textContent = "Error!";
    saveBtn.style.background = "#e74c3c";
    setTimeout(() => {
      saveBtn.textContent = "Save";
      saveBtn.disabled = false;
      saveBtn.style.background = "";
    }, 2000);
  } else {
// --- CHANGE LOG ---
    const original = stockData.find(s => s.ID == tr.dataset.id);
    const trackedFields = ["MRP", "Item_Name", "QTY"];
    const changeLog = trackedFields
      .filter(f => {
        const oldVal = (f === 'QTY' || f === 'MRP') ? Number(original[f]) : (original[f] || "").trim();
        return oldVal !== up[f];
      })
      .map(f => {
        const oldVal = (f === 'QTY' || f === 'MRP') ? Number(original[f]) : (original[f] || "").trim();
        return `${f}:(${oldVal}-->${up[f]})`;
      }).join(", ");

    if (changeLog) {
      await supabase.from("Edits").insert([{
        barcode: original.Barcode,
        item_name: up.Item_Name || original.Item_Name,
        changes: changeLog,
        action: "UPDATE"
      }]);
    }
    // --- END CHANGE LOG ---
    saveBtn.style.background = "#27ae60";
    setTimeout(async () => {
      await Promise.all([fetchData(), loadHsnData()]);
      renderTable();
    }, 800);
  }
};

    tr.querySelector(".deleteBtn").onclick = async () => {
      if (confirm("Delete this item?")) {
      await supabase.from("Edits").insert([{
        barcode: row.Barcode,
        item_name: row.Item_Name,
        changes: "Item deleted",
        action: "DELETE"
      }]);
        await supabase.from("Stock").delete().eq("ID", tr.dataset.id);
        await fetchData(); renderTable();
      }
    };

  } else {
    tr.innerHTML = `
      <td>${row.ID}</td>
      <td>${row.Barcode}</td>
      <td>${row.Item_Name}</td>
      <td>${row.QTY}</td>
      <td>${row.Unit || 'Pcs'}</td>
      <td>${row.MRP}</td>
      <td>
  ${row.HSN || ''}
  ${row.HSN && hsnGstMap[row.HSN] ? `<br><small style="color:#27ae60;font-weight:600;">GST: ${hsnGstMap[row.HSN]}%</small>` : ''}
</td>
    `;
  }

  tbody.appendChild(tr);
  if (editMode) {
  const hsnInput = tr.querySelector(`#hsn_${row.ID}`);
  const gstLabel = tr.querySelector(`#gst_${row.ID}`);
  if (hsnInput && gstLabel) {
    hsnInput.addEventListener("input", () => {
      const val = hsnInput.value.trim();
      gstLabel.textContent = hsnGstMap[val] ? `GST: ${hsnGstMap[val]}%` : '';
    });
  }
}
});

    container.appendChild(table);
    updateSortIndicators();
  }

  // --- SORT ---
  window.sortTable = function(columnIndex) {
    if (currentSortColumn === columnIndex) {
      currentSortDirection *= -1;
    } else {
      currentSortDirection = 1;
    }
    currentSortColumn = columnIndex;
    renderTable();
  };

  function updateSortIndicators() {
    const indicators = container.querySelectorAll(".sort-indicator");
    indicators.forEach((el, i) => {
      if (i === currentSortColumn) {
        el.textContent = currentSortDirection === 1 ? "▲" : "▼";
      } else {
        el.textContent = "";
      }
    });
  }

  // --- ROW EDITING ---
  function enableRowEditing(row) {
    const cells = row.querySelectorAll(".edit-cell");
    cells.forEach(cell => {
      cell.contentEditable = true;
      cell.style.background = "#f9f9a9";
      cell.oninput = () => {
        tr.querySelector(".saveRowBtn").onclick = async () => {
  const saveBtn = tr.querySelector(".saveRowBtn");
  const up = {};
  tr.querySelectorAll(".edit-input").forEach(input => {
    const k = input.dataset.key;
    up[k] = (k === 'QTY' || k === 'MRP') ? Number(input.value) : input.value.trim();
  });

  saveBtn.textContent = "Saving...";
  saveBtn.disabled = true;
  saveBtn.style.background = "#f39c12";

  const { error } = await supabase.from("Stock").update(up).eq("ID", tr.dataset.id);

  if (error) {
    saveBtn.textContent = "Error!";
    saveBtn.style.background = "#e74c3c";
    setTimeout(() => {
      saveBtn.textContent = "Save";
      saveBtn.disabled = false;
      saveBtn.style.background = "";
    }, 2000);
  } else {
    // --- CHANGE LOG ---
    const original = stockData.find(s => s.ID == tr.dataset.id);
    const trackedFields = ["MRP", "Item_Name", "QTY"];
    const changeLog = trackedFields
      .filter(f => {
        const oldVal = (f === 'QTY' || f === 'MRP') ? Number(original[f]) : (original[f] || "").trim();
        return oldVal !== up[f];
      })
      .map(f => {
        const oldVal = (f === 'QTY' || f === 'MRP') ? Number(original[f]) : (original[f] || "").trim();
        return `${f}:(${oldVal}-->${up[f]})`;
      }).join(", ");

    if (changeLog) {
      await supabase.from("Edits").insert([{
        barcode: original.Barcode,
        item_name: up.Item_Name || original.Item_Name,
        changes: changeLog,
        action: "UPDATE"
      }]);
    }
    // --- END CHANGE LOG ---

    saveBtn.textContent = "Saved ✓";
    saveBtn.style.background = "#27ae60";
    setTimeout(async () => {
      await Promise.all([fetchData(), loadHsnData()]);
      renderTable();
    }, 800);
  }
};
      };
    });

    row.querySelector(".deleteBtn").onclick = async () => {
      if (confirm("Delete this item?")) {
        await supabase.from("Stock").delete().eq("ID", row.dataset.id);
        await fetchData(); renderTable();
      }
    };
  }

  // --- ADD ITEM ---
  // --- ADD ITEM ---
addBtn.onclick = () => {
  const tbody = container.querySelector("table tbody");
  const tr = document.createElement("tr");
  tr.classList.add("pendingRow");
  tr.innerHTML = `
    <td>New</td>
    <td><input type="text" class="nBar" placeholder="Barcode"></td>
    <td><input type="text" class="nNam" placeholder="Item Name"></td>
    <td><input type="number" step="0.01" class="nQty" placeholder="0"></td>
    <td><input type="text" class="nUni" value="Pcs"></td>
    <td><input type="number" class="nMrp" placeholder="0"></td>
    <td><input type="text" class="nHsn" placeholder="HSN"></td>
    <td>
      <button class="deleteBtn">Cancel</button>
    </td>
  `;
  tbody.prepend(tr);
  tr.querySelector(".deleteBtn").onclick = () => tr.remove();
};

// --- SAVE ALL PENDING ---
document.getElementById("saveAllBtn").onclick = async () => {
  const pendingRows = container.querySelectorAll(".pendingRow");
  if (!pendingRows.length) return;

  const payloads = [];
  let valid = true;

  pendingRows.forEach(tr => {
    const barcode = tr.querySelector(".nBar").value.trim();
    const name = tr.querySelector(".nNam").value.trim();
    if (!barcode || !name) { valid = false; return; }
    payloads.push({
      Barcode: barcode,
      Item_Name: name,
      QTY: parseFloat(tr.querySelector(".nQty").value) || 0,
      Unit: tr.querySelector(".nUni").value.trim(),
      MRP: parseFloat(tr.querySelector(".nMrp").value) || 0,
      HSN: tr.querySelector(".nHsn").value.trim()
    });
  });

  if (!valid) { alert("Please fill in Barcode and Item Name for all rows."); return; }

  const btn = document.getElementById("saveAllBtn");
  btn.textContent = "Saving...";
  btn.disabled = true;

  const { error } = await supabase.from("Stock").insert(payloads);
    if (error) {
      alert("Error saving items: " + error.message);
      btn.textContent = "Save All";
      btn.disabled = false;
    } else {
      // --- ADD LOG ---
      const editLogs = payloads.map(p => ({
        barcode: p.Barcode,
        item_name: p.Item_Name,
        changes: `QTY:(${p.QTY}), MRP:(${p.MRP}), Unit:(${p.Unit}), HSN:(${p.HSN})`,
        action: "ADD"
      }));
      await supabase.from("Edits").insert(editLogs);
      // --- END ADD LOG ---
      btn.textContent = "Save All";
      btn.disabled = false;
      await fetchData(); renderTable();
    }
};

  // --- CSV EXPORT ---
  downloadBtn.onclick = () => {
  const headers = "ID,Barcode,Item Name,Quantity,Price(INR),HSN\n";
  const rows = stockData.map(r => `${r.ID},"=""${r.Barcode}""","${r.Item_Name}",${r.QTY},${r.MRP},"${r.HSN || ''}"`).join("\n");
    const blob = new Blob([headers + rows], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `Evergreen_Stock_${new Date().toLocaleDateString()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  // --- EDIT TOGGLE ---
  editBtn.onclick = () => {
    editMode = !editMode;
    editBtn.textContent = editMode ? "Disable Edit Mode" : "Enable Edit Mode";
    addBtn.style.display = editMode ? "inline-block" : "none";
    document.getElementById("saveAllBtn").style.display = editMode ? "inline-block" : "none";
    renderTable();
  };

  // --- SEARCH LISTENERS ---
  searchName.oninput = renderTable;
  searchBarcode.oninput = renderTable;

  // --- INIT ---
  await Promise.all([fetchData(), loadHsnData()]);
  renderTable();
});
</script>
</body>
          </html>
