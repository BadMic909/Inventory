<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sales - Evergreen Golf</title>
  <link rel="stylesheet" href="index.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    #warningModal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:30px; border-radius:12px; box-shadow:0 0 20px rgba(0,0,0,0.5); z-index:2000; text-align:center; }
    #overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1999; }
    .action-btns { display: flex; flex-direction: column; gap: 8px; }
    .invoiceCell { font-weight: bold; font-size: 1.1em; color: #2c3e50; }
  </style>
</head>
<body class="loaded">

<div id="overlay"></div>
<div id="warningModal">
  <h3 style="color:#000000">Insufficient Stock!</h3>
  <p id="warningText"></p>
  <br>
  <button class="saveBtn" onclick="location.href='items.html'">Go to Stock Overview</button>
  <button class="cancelBtn" onclick="closeWarning()">Close</button>
</div>

<nav id="topBar"><h2>Evergreen Golf Inventory Management System</h2></nav>
<nav id="rightSidebar">
  <ul>
    <li id="red"><button id="logoutBtn">Logout</button></li>
    <li class="active"><a href="sales.html">Sales</a></li>
    <li><a href="items.html">Stock</a></li>
  </ul>
</nav>

<div id="mainContent">
  <h1>Sales Overview</h1>
  <button id="addSaleBtn" class="addBtn">+ New Sale</button>
  <br><br>
  <input type="text" id="searchInput" placeholder="Search Customer...">
  <table id="salesTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Sale No</th>
        <th>Customer</th>
        <th>Items Bought</th>
        <th>Total (₹)</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const SUPABASE_URL = "https://krveybwqyuuipenhawtx.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_5nif9Qruk9n0ChTqgdtoIQ_g2YHVbao";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // --- SESSION CHECK ---
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = "Login.html"; return; }

  let salesData = [], stockData = [], hsnGstMap = {};

  // --- LOGOUT ---
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.onclick = async () => {
      await supabase.auth.signOut();
      window.location.href = "Login.html";
    };
  }

  // --- LOAD HSN CSV ---
  async function loadHsnData() {
    try {
      const res = await fetch("https://krveybwqyuuipenhawtx.supabase.co/storage/v1/object/public/Pub/hsn4_gst_rates.csv");
      const text = await res.text();
      text.trim().split("\n").slice(1).forEach(line => {
        const cols = [];
        let cur = "", inQ = false;
        for (let ch of line) {
          if (ch === '"') inQ = !inQ;
          else if (ch === ',' && !inQ) { cols.push(cur); cur = ""; }
          else cur += ch;
        }
        cols.push(cur);
        const hsn = cols[0]?.trim();
        const gst = cols[2]?.trim();
        if (hsn) hsnGstMap[hsn] = gst || "0";
      });
    } catch(e) { console.error("HSN load failed", e); }
  }

  // --- FETCH DATA ---
  async function fetchData() {
    const { data: sales } = await supabase.from("Sales").select("*").order("id", { ascending: false });
    const { data: stock } = await supabase.from("Stock").select("*");
    salesData = sales || [];
    stockData = stock || [];
  }

  // Helper: barcode -> gst rate number
  function getGstRate(barcode) {
    const s = stockData.find(x => x.Barcode == barcode);
    if (!s || !s.HSN) return 0;
    return parseFloat(hsnGstMap[String(s.HSN)]) || 0;
  }

  const tbody = document.querySelector("#salesTable tbody");

  // --- RENDER TABLE ---
  function renderTable() {
    tbody.innerHTML = "";
    salesData.forEach(row => {
      const itemsHtml = (row.Item_RP || []).map(i => {
        const s = stockData.find(x => x.Barcode == i.barcode);
        return `<div>${s ? s.Item_Name : '??'} | ${i.qty || 1} @ ₹${i.price}</div>`;
      }).join("");
// --- SEARCH ---
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${row.id}</td>
        <td>${row.Sale_No}</td>
        <td>${row.Customer_Name}</td>
        <td>${itemsHtml}</td>
        <td>₹${(row.Invoice || 0).toLocaleString()}</td>
        <td class="action-btns">
          <button class="saveBtn" onclick="enterEditMode(${row.id})">Edit</button>
          <button class="deleteBtn" onclick="deleteSale(${row.id})">Delete</button>
        </td>`;
      tbody.appendChild(tr);
    });
  }
  document.getElementById("searchInput").addEventListener("input", function () {
  const query = this.value.toLowerCase().trim();
  [...tbody.children].forEach(tr => {
    const customer = tr.children[2]?.textContent.toLowerCase() || "";
    tr.style.display = customer.includes(query) ? "" : "none";
  });
});

  // --- DELETE SALE ---
window.deleteSale = async (id) => {
  if (confirm("Delete this sale record?")) {
    const { data: oldSale } = await supabase.from("Sales").select("*").eq("id", id).single();
    const oldItems = oldSale ? oldSale.Item_RP : [];

    // NOW insert to SaleEdits (oldSale exists)
    await supabase.from("SaleEdits").insert([{
      sale_no: oldSale.Sale_No,
      customer: oldSale.Customer_Name,
      changes: "Sale deleted",
      action: "DELETE"
    }]);

    for (const oldItem of oldItems) {
      const { data: cur } = await supabase.from("Stock").select("QTY").eq("Barcode", oldItem.barcode).single();
      if (cur) {
        await supabase.from("Stock").update({ QTY: cur.QTY + oldItem.qty }).eq("Barcode", oldItem.barcode);
      }
    }

    await supabase.from("Sales").delete().eq("id", id);
    await fetchData(); renderTable();
  }
};

  // --- EDIT MODE ---
  window.enterEditMode = (id) => {
    const sale = salesData.find(s => s.id == id);
    const tr = [...tbody.children].find(r => r.children[0].textContent == id);
    tr.innerHTML = `
      <td>${sale.id}</td>
      <td><input type="number" class="saleNoInput" value="${sale.Sale_No}"></td>
      <td><input type="text" class="customerInput" value="${sale.Customer_Name || ''}"></td>
      <td><div class="itemsContainer"></div><button class="addBtn" onclick="addItemRow(this)">+ Item</button></td>
      <td class="invoiceCell">₹0</td>
      <td class="action-btns">
        <button class="saveBtn" onclick="saveSale(${id}, this)">Complete Sale</button>
        <button class="addBtn" style="background:#f39c12" onclick="downloadInvoice(${id}, this)">🧾 Receipt</button>
        <button class="cancelBtn" onclick="location.reload()">Cancel</button>
      </td>
    `;
    const container = tr.querySelector(".itemsContainer");
    (sale.Item_RP || []).forEach(i => addItemRow(null, container, i.barcode, i.price, i.qty));
    updateTotalLive(tr);
  };

  // --- ADD ITEM ROW ---
  window.addItemRow = (btn, container, bc="", pr="", qty=1) => {
    const target = container || btn.previousElementSibling;
    const div = document.createElement("div");
    div.className = "itemRow";
    div.style.marginBottom = "8px";
    div.innerHTML = `
      <input type="text" class="bc" value="${bc}" placeholder="Barcode" style="width:90px">
      <input type="number" class="qtyInput" value="${qty}" style="width:50px">
      <input type="number" class="pr" value="${pr}" placeholder="Price (incl. GST)" style="width:80px">
      <small class="gstTag" style="color:#000000;font-weight:600;margin-left:4px; margin-top:10px"></small>
      <button class="deleteBtn" style="padding:2px 8px;" onclick="this.parentElement.remove(); updateTotalLive(this.closest('tr'))">x</button>
    `;
    target.appendChild(div);

    const bcInp = div.querySelector(".bc");
    const prInp = div.querySelector(".pr");
    const gstTag = div.querySelector(".gstTag");
let mrp = parseFloat(pr) || 0; // store original MRP

function updateGstTag() {
  const rate = getGstRate(bcInp.value.trim());
  const price = parseFloat(prInp.value) || 0;
  const discount =mrp- price ;

  let tagHtml = '';
  if (rate && price) {
    const gstAmt = price - (price / (1 + rate / 100));
    tagHtml += `GST(${rate}%): ₹${gstAmt.toFixed(2)}`;
  } else if (rate) {
    tagHtml += `GST: ${rate}%`;
  }
  if (mrp && discount !== 0) {
    const discColor = discount < 0 ? "#1cc88a" : "#e74c3c";
    tagHtml += ` &nbsp;<span style="color:${discColor};">Disc: ₹${discount.toFixed(2)}</span>`;
  }
  gstTag.innerHTML = tagHtml;
}

// update MRP when barcode is scanned
bcInp.addEventListener("input", () => {
  const s = stockData.find(x => x.Barcode == bcInp.value.trim());
  if (s) { prInp.value = s.MRP; mrp = parseFloat(s.MRP) || 0; }
  updateGstTag();
  updateTotalLive(div.closest("tr"));
});

    if (bc) updateGstTag();

    [div.querySelector(".qtyInput"), prInp].forEach(input => {
  input.addEventListener("input", () => {
    updateGstTag();
    updateTotalLive(div.closest("tr"));
  });
  });
  };

  // --- UPDATE TOTAL LIVE ---
  window.updateTotalLive = (tr) => {
    let total = 0;
    tr.querySelectorAll(".itemRow").forEach(row => {
      total += (parseFloat(row.querySelector(".qtyInput").value) || 0) *
               (parseFloat(row.querySelector(".pr").value) || 0);
    });
    tr.querySelector(".invoiceCell").textContent = "₹" + total.toLocaleString();
  };

  // --- SAVE SALE ---
  window.saveSale = async (id, btn) => {
    const tr = btn.closest("tr");
    const newItems = [...tr.querySelectorAll(".itemRow")].map(r => ({
      barcode: r.querySelector(".bc").value.trim(),
      qty: parseFloat(r.querySelector(".qtyInput").value) || 0,
      price: parseFloat(r.querySelector(".pr").value) || 0
    }));

    const { data: oldSale } = await supabase.from("Sales").select("Item_RP").eq("id", id).single();
    const oldItems = oldSale ? oldSale.Item_RP : [];

    for (const newItem of newItems) {
      const s = stockData.find(x => x.Barcode == newItem.barcode);
      const oldQty = (oldItems.find(oi => oi.barcode === newItem.barcode) || {}).qty || 0;
      const { data: liveStock } = await supabase.from("Stock").select("QTY").eq("Barcode", newItem.barcode).single();
      const effectiveStock = (liveStock ? liveStock.QTY : 0) + oldQty;
      if (!s || effectiveStock < newItem.qty) {
        showWarning(`Item: ${s ? s.Item_Name : newItem.barcode}<br>Available: ${effectiveStock} | Req: ${newItem.qty}`);
        return;
      }
      if (newItem.qty <= 0) {
        showWarning(`Item: ${s ? s.Item_Name : newItem.barcode}<br>Quantity must be greater than 0`);
        return;
      }
    }

// Aggregate old items to restore
const restoreMap = {};
for (const oi of oldItems) {
  restoreMap[oi.barcode] = (restoreMap[oi.barcode] || 0) + oi.qty;
}

// Aggregate new items to deduct
const deductMap = {};
for (const ni of newItems) {
  deductMap[ni.barcode] = (deductMap[ni.barcode] || 0) + ni.qty;
}

// Net change per barcode: positive = restore, negative = deduct
const allBarcodes = new Set([...Object.keys(restoreMap), ...Object.keys(deductMap)]);
for (const bc of allBarcodes) {
  const net = (restoreMap[bc] || 0) - (deductMap[bc] || 0);
  if (net === 0) continue;
  const { data: cur } = await supabase.from("Stock").select("QTY").eq("Barcode", bc).single();
  await supabase.from("Stock").update({ QTY: cur.QTY + net }).eq("Barcode", bc);
}

    const total = newItems.reduce((a, b) => a + b.price * b.qty, 0);
    await supabase.from("Sales").update({
      Sale_No: Number(tr.querySelector(".saleNoInput").value),
      Customer_Name: tr.querySelector(".customerInput").value,
      Item_RP: newItems,
      Invoice: total
    }).eq("id", id);
    const oldSale2 = salesData.find(s => s.id == id);
    const changeParts = [];
    
    if (Number(tr.querySelector(".saleNoInput").value) !== oldSale2.Sale_No)
      changeParts.push(`Sale_No:(${oldSale2.Sale_No}-->${tr.querySelector(".saleNoInput").value})`);
    
    if (tr.querySelector(".customerInput").value !== oldSale2.Customer_Name)
      changeParts.push(`Customer:(${oldSale2.Customer_Name}-->${tr.querySelector(".customerInput").value})`);
    
    if (total !== oldSale2.Invoice)
      changeParts.push(`Invoice:(${oldSale2.Invoice}-->${total})`);
    
    if (changeParts.length > 0) {
      await supabase.from("SaleEdits").insert([{
        sale_no: oldSale2.Sale_No,
        customer: oldSale2.Customer_Name,
        changes: changeParts.join(", "),
        action: "UPDATE"
      }]);
    }
    alert("Sale Updated & Stock Adjusted!");
    await fetchData(); renderTable();
  };

  // --- DOWNLOAD INVOICE ---
  window.downloadInvoice = async (id, btn) => {

  const tr = btn.closest("tr");
  const customer = tr.querySelector(".customerInput").value || "Valued Customer";
  const saleNo = tr.querySelector(".saleNoInput").value || "N/A";

  const paint = prompt("Paid? True/False");
  const paid = paint && (paint.toLowerCase() === "false" || paint.toLowerCase() === "not paid");
  const Pay = paid ? "Payment Pending":"Paid";
  const color = paid ? "#e74c3c":"#1cc88a";

  const items = [...tr.querySelectorAll(".itemRow")].map(r => {
    const bc = r.querySelector(".bc").value.trim();
    const s = stockData.find(x => x.Barcode == bc);
    return {
      barcode: bc,
      hsn: s?.HSN || null,
      name: s ? s.Item_Name : bc,
      mrp: parseFloat(s?.MRP) || 0,   // ← add this
      qty: parseFloat(r.querySelector(".qtyInput").value) || 0,
      price: parseFloat(r.querySelector(".pr").value) || 0
    };
  });

  let grandTotal = 0, totalGst = 0;let totalDiscount = 0;

  const rowsHtml = items.map(i => {
  const lineTotal = i.qty * i.price;
  grandTotal += lineTotal;
  const gstRate = i.hsn ? parseFloat(hsnGstMap[String(i.hsn)]) || 0 : 0;
  const lineGst = lineTotal - (lineTotal / (1 + gstRate / 100));
  totalGst += lineGst;

  const lineMrp = i.qty * i.mrp;
  const lineDiscount = lineTotal - lineMrp; // negative = discount given
  totalDiscount -= lineDiscount;

  return `
    <tr style="border-bottom:1px dotted #ddd;">
      <td style="padding:3px 0; text-align:left;">
        ${i.name}
        ${i.hsn ? `<br><span style="font-size:9px;color:#000000;">HSN:${i.hsn}</span>` : ''}
      </td>
      <td style="padding:3px 0; text-align:center;">${i.qty}</td>
      <td style="padding:3px 0; text-align:right;">
        ${i.mrp !== i.price ? `<span style="text-decoration:line-through;color:#999;">₹${i.mrp.toFixed(2)}</span><br>` : ''}
        ₹${i.price.toFixed(2)}
      </td>
      <td style="padding:3px 0; text-align:right;">
        ₹${lineTotal.toFixed(2)}
        ${gstRate ? `<br><span style="font-size:9px;color:#000000;">GST(${gstRate}%):₹${lineGst.toFixed(2)}</span>` : ''}
      </td>
    </tr>`;
}).join("");  // ← THIS was missing

  const subtotal = grandTotal - totalGst;

  const element = document.createElement('div');
  element.innerHTML = `
    <div style="width:67mm; font-family:'Poppins', sans-serif; color:#000000; font-size:11px; font-weight:bold;">

      <div style="text-align:center; border-bottom:1px dashed #333; padding-bottom:8px; margin-bottom:8px;">
        <div style="font-weight:bold; font-size:13px; margin-top:4px;">INVOICE #SALE-${saleNo}</div>
        <div style="color:#000000; font-size:10px;">${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString()}</div>
      </div>

      <div style="border-bottom:1px dashed #333; padding-bottom:6px; margin-bottom:6px; font-size:11px;">
        <div><b>Billed To:</b> ${customer}</div>
        <div><b>Status:</b> <span style="color:000000;">${Pay}</span></div>
      </div>

      <table style="width:100%; border-collapse:collapse; font-size:10px;">
<thead>
  <tr style="border-bottom:1px solid #000000; text-align:center;">
    <th style="padding:3px 0; text-align:center;">Item</th>
    <th style="padding:3px 0; text-align:center;">Qty</th>
    <th style="padding:3px 0; text-align:center;">Price</th>
    <th style="padding:3px 0; text-align:center;">Total</th>
  </tr>
</thead>
        <tbody>${rowsHtml}</tbody>
      </table>

      <div style="border-top:1px dashed #333; margin-top:6px; padding-top:6px; font-size:11px;">
        <div style="display:flex; justify-content:space-between;">
          <span style="color:#000000;">Subtotal (excl. GST):</span>
          <span>₹${subtotal.toFixed(2)}</span>
        </div>
        ${totalDiscount !== 0 ? `
<div style="display:flex; justify-content:space-between; color: '#000000'};">
  <span>Discount:</span>
  <span>₹${totalDiscount.toFixed(2)}</span>
</div>` : ''}
        <div style="display:flex; justify-content:space-between;">
          <span style="color:#000000;">Total GST:</span>
          <span>₹${totalGst.toFixed(2)}</span>
        </div>
        <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:13px; border-top:1px dashed #333; margin-top:4px; padding-top:4px;">
          <span>Grand Total:</span>
          <span>₹${grandTotal.toFixed(2)}</span>
        </div>
      </div>

<div style="text-align:center; margin-top:12px; border-top:1px dashed #333; padding-top:8px; font-size:10px; color:#000000;">
        <div style="font-weight:bold; color:#000000;">Thank you for shopping with us!</div>
        <div>Evergreen Golf | Premium Golf Equipment</div>
        <div>Unit no 5, Sevaganapalli Village & Post,</div>
        <div>Hosur Taluk, Krishnagiri District</div>
        <div>GST: 33AQQPS0101C1ZD</div>
        <div style="margin-top:20px;">&nbsp;</div>
      </div>

    </div>`;
element.style.cssText = 'width:72mm; position:fixed; top:40px; left:0; z-index:-9999; opacity:0; padding-top:10mm;';
document.body.appendChild(element);

await new Promise(r => setTimeout(r, 300));
const contentHeightMm = element.offsetHeight * 0.274583 + 15;
  
  const opt = {
    margin: [8, 4, 4, 4],
    filename: `Invoice_${saleNo}.pdf`,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, logging: false, letterRendering: true, width: 272 },
    jsPDF: { unit: 'mm', format: [80, 297], orientation: 'portrait' }
  };

  html2pdf().from(element.innerHTML).set(opt).save().then(() => {
      document.body.removeChild(element);
  });
};

  // --- WARNING MODAL ---
  window.showWarning = (msg) => {
    document.getElementById("warningText").innerHTML = msg;
    document.getElementById("warningModal").style.display = "block";
    document.getElementById("overlay").style.display = "block";
  };
  window.closeWarning = () => {
    document.getElementById("warningModal").style.display = "none";
    document.getElementById("overlay").style.display = "none";
  };

  // --- ADD NEW SALE ---
  document.getElementById("addSaleBtn").onclick = async () => {
    const { data } = await supabase.from("Sales").insert([{ Sale_No: 1, Item_RP: [], Invoice: 0, Customer_Name: "" }]).select().single();
    await fetchData(); renderTable(); enterEditMode(data.id);
  };

  // --- INIT ---
  await Promise.all([fetchData(), loadHsnData()]);
  renderTable();
});
</script>
</body>
</html>
