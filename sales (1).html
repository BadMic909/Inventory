<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales — Evergreen Golf</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --green-dark:   #071810;
      --green-mid:    #0f2d1e;
      --green-accent: #3aad70;
      --green-light:  #4ccc86;
      --gold:         #c9a84c;
      --gold-light:   #e8c97a;
      --cream:        #cce0d4;
      --bg:           #0a1a10;
      --surface:      #0f2318;
      --border:       #1c3826;
      --text:         #d4ead9;
      --text-muted:   #5e8c6e;
      --red:          #e06355;
      --red-light:    #2a1010;
      --radius:       12px;
      --shadow:       0 2px 12px rgba(0,0,0,.4);
      --shadow-lg:    0 8px 32px rgba(0,0,0,.55);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── TOP NAV ── */
    #topBar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--green-mid);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 60px;
      box-shadow: 0 2px 16px rgba(0,0,0,.25);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: var(--gold);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      color: var(--cream);
      letter-spacing: .3px;
    }

    .brand-name span {
      color: var(--gold);
    }

    /* ── SIDE NAV ── */
    #rightSidebar {
      position: fixed;
      top: 60px;
      right: 0;
      width: 200px;
      height: calc(100vh - 60px);
      background: var(--green-dark);
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      z-index: 90;
      border-left: 1px solid rgba(255,255,255,.06);
    }

    #rightSidebar ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 0 12px;
    }

    #rightSidebar li a,
    #rightSidebar li button {
      display: block;
      width: 100%;
      padding: 10px 16px;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      color: rgba(255,255,255,.65);
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: left;
      transition: all .18s;
      letter-spacing: .2px;
    }

    #rightSidebar li.active a,
    #rightSidebar li a:hover {
      background: rgba(255,255,255,.1);
      color: #fff;
    }

    #rightSidebar li#red button {
      color: #f1948a;
      margin-top: auto;
    }
    #rightSidebar li#red button:hover {
      background: rgba(192,57,43,.2);
      color: #e74c3c;
    }

    /* ── MAIN CONTENT ── */
    #mainContent {
      margin-right: 200px;
      padding: 32px 32px 80px;
      min-height: calc(100vh - 60px);
    }

    /* ── PAGE HEADER ── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      color: var(--text);
      font-weight: 600;
    }

    .page-title span {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: 8px;
    }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all .18s;
      white-space: nowrap;
      letter-spacing: .2px;
    }

    .btn-primary {
      background: var(--green-accent);
      color: #fff;
    }
    .btn-primary:hover { background: #1a4a32; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(46,125,82,.3); }

    .btn-save {
      background: var(--green-accent);
      color: #fff;
    }
    .btn-save:hover { background: #1a4a32; }

    .btn-danger {
      background: var(--red-light);
      color: var(--red);
      border: 1px solid #4a1a1a;
    }
    .btn-danger:hover { background: #3a1515; }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--border); color: var(--text); }

    .btn-amber {
      background: #231a06;
      color: #e8b84b;
      border: 1px solid #4a3810;
    }
    .btn-amber:hover { background: #2e2208; }

    .btn-add-item {
      background: transparent;
      color: var(--green-accent);
      border: 1px dashed var(--green-accent);
      font-size: 12px;
      padding: 6px 14px;
    }
    .btn-add-item:hover { background: #0d2a1a; }

    /* ── SEARCH ── */
    .search-wrap {
      position: relative;
      margin-bottom: 20px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 15px;
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      max-width: 360px;
      padding: 10px 14px 10px 40px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    #searchInput:focus { border-color: var(--green-accent); box-shadow: 0 0 0 3px rgba(46,125,82,.12); }
    #searchInput::placeholder { color: var(--text-muted); }

    /* ── TABLE ── */
    .table-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    #salesTable {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    #salesTable thead th {
      background: var(--green-dark);
      color: rgba(255,255,255,.75);
      font-weight: 500;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 14px 18px;
      text-align: left;
    }
    #salesTable thead th.sortable {
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    #salesTable thead th.sortable:hover { color: #fff; background: #0d2218; }
    #salesTable thead th .sort-icon { margin-left: 5px; opacity: 0.4; font-style: normal; }
    #salesTable thead th.sort-asc .sort-icon,
    #salesTable thead th.sort-desc .sort-icon { opacity: 1; color: var(--green-accent); }
    .date-cell { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .date-cell .time { display: block; font-size: 11px; color: var(--text-muted); opacity: 0.7; }

    #salesTable tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .14s;
    }
    #salesTable tbody tr:last-child { border-bottom: none; }
    #salesTable tbody tr:hover { background: #142b1c; }

    #salesTable td {
      padding: 14px 18px;
      vertical-align: middle;
      color: var(--text);
    }

    .sale-id {
      color: var(--text-muted);
      font-size: 12px;
    }

    .sale-no {
      font-weight: 700;
      font-size: 14px;
      color: var(--green-accent);
    }

    .customer-name {
      font-weight: 500;
    }

    .item-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0d2e1c;
      border: 1px solid #1e4a2c;
      color: var(--green-accent);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 500;
      margin: 2px 0;
    }

    .invoice-amount {
      font-weight: 700;
      font-size: 14px;
      color: var(--green-light);
    }

    .action-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ── EDIT ROW ── */
    .edit-input {
      width: 100%;
      padding: 8px 12px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--text);
      outline: none;
      background: #0d2218;
      transition: border-color .18s;
    }
    .edit-input:focus { border-color: var(--green-accent); box-shadow: 0 0 0 3px rgba(46,125,82,.1); }

    .item-row {
      display: grid;
      grid-template-columns: 90px 55px 80px 1fr auto;
      gap: 6px;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #1a3322;
    }
    .item-row:last-child { border-bottom: none; }

    .item-row .edit-input {
      padding: 6px 10px;
      font-size: 12px;
    }

    .gst-tag {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
    }

    .items-container {
      background: #0d2018;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 8px;
      border: 1px solid #1a3322;
    }

    .invoice-live {
      font-weight: 700;
      font-size: 16px;
      color: var(--green-light);
    }

    /* ── MODAL ── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 1999;
      backdrop-filter: blur(3px);
    }

    #warningModal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--surface);
      padding: 32px 28px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.7);
      z-index: 2000;
      text-align: center;
      max-width: 360px;
      width: 90%;
    }

    .modal-icon {
      width: 52px;
      height: 52px;
      background: #2a1010;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 22px;
    }

    #warningModal h3 {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      color: var(--text);
      margin-bottom: 8px;
    }

    #warningText {
      color: var(--text-muted);
      font-size: 13.5px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: .4; }
    .empty-state p { font-size: 14px; }

    /* ── RESPONSIVE / MOBILE ── */
    @media (max-width: 768px) {
      #rightSidebar {
        position: fixed;
        bottom: 0;
        top: auto;
        right: 0;
        left: 0;
        width: 100%;
        height: 60px;
        flex-direction: row;
        padding: 0;
        border-left: none;
        border-top: 1px solid rgba(255,255,255,.08);
      }

      #rightSidebar ul {
        flex-direction: row;
        align-items: center;
        justify-content: space-around;
        width: 100%;
        padding: 0 8px;
        gap: 0;
      }

      #rightSidebar li { flex: 1; }

      #rightSidebar li a,
      #rightSidebar li button {
        text-align: center;
        padding: 8px 4px;
        font-size: 12px;
        border-radius: 6px;
      }

      #mainContent {
        margin-right: 0;
        padding: 20px 16px 100px;
      }

      .brand-name { font-size: 13px; }

      .page-header { margin-bottom: 20px; }
      .page-title { font-size: 21px; }

      #searchInput { max-width: 100%; }

      /* Mobile card layout instead of table */
      #salesTable, #salesTable thead, #salesTable tbody, #salesTable th, #salesTable td, #salesTable tr {
        display: block;
      }

      #salesTable thead { display: none; }

      #salesTable tbody tr {
        margin-bottom: 12px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        padding: 14px;
        position: relative;
        background: var(--surface);
      }

      #salesTable tbody tr:hover { background: var(--surface); }

      #salesTable td {
        padding: 4px 0;
        border: none;
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font-size: 13px;
      }

      #salesTable td::before {
        content: attr(data-label);
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .8px;
        color: var(--text-muted);
        min-width: 72px;
        padding-top: 1px;
      }

      .action-btns { flex-direction: row; flex-wrap: wrap; }

      .item-row {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto;
        gap: 4px;
      }

      .item-row .edit-input { font-size: 13px; }
    }

    @media (max-width: 480px) {
      #topBar { padding: 0 16px; }
      .brand-name { display: none; }
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .table-card { animation: fadeInUp .3s ease both; }

    #salesTable tbody tr {
      animation: fadeInUp .25s ease both;
    }
  </style>
</head>
<body>

<div id="overlay"></div>
<div id="warningModal">
  <div class="modal-icon">⚠️</div>
  <h3>Insufficient Stock</h3>
  <p id="warningText"></p>
  <div class="modal-actions">
    <button class="btn btn-primary" onclick="location.href='items.html'">Go to Stock</button>
    <button class="btn btn-ghost" onclick="closeWarning()">Close</button>
  </div>
</div>

<!-- TOP BAR -->
<nav id="topBar">
  <div class="brand">
    <div class="brand-icon">⛳</div>
    <div class="brand-name">Evergreen <span>Golf</span></div>
  </div>
</nav>

<!-- SIDEBAR -->
<nav id="rightSidebar">
  <ul>
    <li class="active"><a href="sales.html">💰 Sales</a></li>
    <li><a href="items.html">📦 Stock</a></li>
    <li id="red"><button id="logoutBtn">↩ Logout</button></li>
  </ul>
</nav>

<!-- MAIN -->
<div id="mainContent">
  <div class="page-header">
    <div class="page-title">Sales <span id="salesCount"></span></div>
    <button id="addSaleBtn" class="btn btn-primary">+ New Sale</button>
  </div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search by customer name…">
  </div>

  <div class="table-card">
    <table id="salesTable">
      <thead>
        <tr>
          <th class="sortable" data-col="id">ID <i class="sort-icon">⇅</i></th>
          <th class="sortable" data-col="Sale_No">Sale No <i class="sort-icon">⇅</i></th>
          <th class="sortable" data-col="Customer_Name">Customer <i class="sort-icon">⇅</i></th>
          <th>Items</th>
          <th class="sortable" data-col="Invoice">Total <i class="sort-icon">⇅</i></th>
          <th class="sortable" data-col="created_at">Date <i class="sort-icon">⇅</i></th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const SUPABASE_URL = "https://krveybwqyuuipenhawtx.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_5nif9Qruk9n0ChTqgdtoIQ_g2YHVbao";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = "Login.html"; return; }

  let salesData = [], stockData = [], hsnGstMap = {};
  let sortCol = 'id', sortAsc = false;

  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.onclick = async () => {
      await supabase.auth.signOut();
      window.location.href = "Login.html";
    };
  }

  async function loadHsnData() {
    try {
      const res = await fetch("https://krveybwqyuuipenhawtx.supabase.co/storage/v1/object/public/Pub/hsn4_gst_rates.csv");
      const text = await res.text();
      text.trim().split("\n").slice(1).forEach(line => {
        const cols = [];
        let cur = "", inQ = false;
        for (let ch of line) {
          if (ch === '"') inQ = !inQ;
          else if (ch === ',' && !inQ) { cols.push(cur); cur = ""; }
          else cur += ch;
        }
        cols.push(cur);
        const hsn = cols[0]?.trim();
        const gst = cols[2]?.trim();
        if (hsn) hsnGstMap[hsn] = gst || "0";
      });
    } catch(e) { console.error("HSN load failed", e); }
  }

  async function fetchData() {
    const { data: sales } = await supabase.from("Sales").select("*").order("id", { ascending: false });
    const { data: stock } = await supabase.from("Stock").select("*");
    salesData = sales || [];
    stockData = stock || [];
  }

  function getGstRate(barcode) {
    const s = stockData.find(x => x.Barcode == barcode);
    if (!s || !s.HSN) return 0;
    return parseFloat(hsnGstMap[String(s.HSN)]) || 0;
  }

  const tbody = document.querySelector("#salesTable tbody");

  document.querySelectorAll('#salesTable thead th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      if (sortCol === th.dataset.col) sortAsc = !sortAsc;
      else { sortCol = th.dataset.col; sortAsc = true; }
      renderTable();
    });
  });

  function renderTable() {
    tbody.innerHTML = "";
    // Sort
    const sorted = [...salesData].sort((a, b) => {
      let va = a[sortCol], vb = b[sortCol];
      if (sortCol === 'created_at') { va = new Date(va||0); vb = new Date(vb||0); }
      else if (typeof va === 'string') { va = va.toLowerCase(); vb = (vb||'').toLowerCase(); }
      else { va = va||0; vb = vb||0; }
      return sortAsc ? (va > vb ? 1 : va < vb ? -1 : 0) : (va < vb ? 1 : va > vb ? -1 : 0);
    });
    // Update header icons
    document.querySelectorAll('#salesTable thead th.sortable').forEach(th => {
      th.classList.remove('sort-asc','sort-desc');
      if (th.dataset.col === sortCol) th.classList.add(sortAsc ? 'sort-asc' : 'sort-desc');
    });
    const count = sorted.length;
    document.getElementById("salesCount").textContent = count ? `— ${count} records` : "";

    if (!count) {
      tbody.innerHTML = `<tr><td colspan="7" style="padding:0;border:none;">
        <div class="empty-state">
          <div class="icon">🛒</div>
          <p>No sales yet. Create your first sale!</p>
        </div>
      </td></tr>`;
      return;
    }

    sorted.forEach((row, i) => {
      const itemsHtml = (row.Item_RP || []).map(item => {
        const s = stockData.find(x => x.Barcode == item.barcode);
        return `<div class="item-chip">
          <span>${s ? s.Item_Name : '??'}</span>
          <span style="color:var(--text-muted)">×${item.qty}</span>
          <span style="color:var(--green-accent);font-weight:600">₹${item.price}</span>
        </div>`;
      }).join("");

      const tr = document.createElement("tr");
      tr.style.animationDelay = `${i * 0.04}s`;
      tr.innerHTML = `
        <td data-label="ID"><span class="sale-id">#${row.id}</span></td>
        <td data-label="Sale No"><span class="sale-no">SALE-${row.Sale_No}</span></td>
        <td data-label="Customer"><span class="customer-name">${row.Customer_Name || '—'}</span></td>
        <td data-label="Items"><div style="display:flex;flex-wrap:wrap;gap:4px;">${itemsHtml || '<span style="color:var(--text-muted);font-size:12px;">No items</span>'}</div></td>
        <td data-label="Total"><span class="invoice-amount">₹${(row.Invoice || 0).toLocaleString()}</span></td>
        <td data-label="Date"><span class="date-cell">${row.created_at ? new Date(row.created_at).toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'}) : '—'}<span class="time">${row.created_at ? new Date(row.created_at).toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit'}) : ''}</span></span></td>
        <td data-label="Actions">
          <div class="action-btns">
            <button class="btn btn-save" style="font-size:12px;padding:7px 14px;" onclick="enterEditMode(${row.id})">✏️ Edit</button>
            <button class="btn btn-danger" style="font-size:12px;padding:7px 14px;" onclick="deleteSale(${row.id})">🗑 Delete</button>
          </div>
        </td>`;
      tbody.appendChild(tr);
    });
  }

  document.getElementById("searchInput").addEventListener("input", function () {
    const query = this.value.toLowerCase().trim();
    [...tbody.children].forEach(tr => {
      const customer = tr.children[2]?.textContent.toLowerCase() || "";
      tr.style.display = customer.includes(query) ? "" : "none";
    });
  });

  window.deleteSale = async (id) => {
    if (confirm("Delete this sale record?")) {
      const { data: oldSale } = await supabase.from("Sales").select("*").eq("id", id).single();
      const oldItems = oldSale ? oldSale.Item_RP : [];

      await supabase.from("SaleEdits").insert([{
        sale_no: oldSale.Sale_No,
        customer: oldSale.Customer_Name,
        changes: "Sale deleted",
        action: "DELETE"
      }]);

      for (const oldItem of oldItems) {
        const { data: cur } = await supabase.from("Stock").select("QTY").eq("Barcode", oldItem.barcode).single();
        if (cur) {
          await supabase.from("Stock").update({ QTY: cur.QTY + oldItem.qty }).eq("Barcode", oldItem.barcode);
        }
      }

      await supabase.from("Sales").delete().eq("id", id);
      await fetchData(); renderTable();
    }
  };

  window.enterEditMode = (id) => {
    const sale = salesData.find(s => s.id == id);
    const tr = [...tbody.children].find(r => r.children[0].querySelector('.sale-id')?.textContent.replace('#','').trim() == id);
    tr.innerHTML = `
      <td data-label="ID"><span class="sale-id">#${sale.id}</span></td>
      <td data-label="Sale No"><input class="edit-input saleNoInput" type="number" value="${sale.Sale_No}" style="width:90px"></td>
      <td data-label="Customer"><input class="edit-input customerInput" type="text" value="${sale.Customer_Name || ''}" style="min-width:140px"></td>
      <td data-label="Items">
        <div class="items-container itemsContainer"></div>
        <button class="btn btn-add-item" onclick="addItemRow(this)">+ Add Item</button>
      </td>
      <td data-label="Total"><span class="invoice-live invoiceCell">₹0</span></td>
      <td data-label="Actions">
        <div class="action-btns">
          <button class="btn btn-save" style="font-size:12px;padding:7px 14px;" onclick="saveSale(${id}, this)">✅ Save</button>
          <button class="btn btn-amber" style="font-size:12px;padding:7px 14px;" onclick="downloadInvoice(${id}, this)">🧾 Receipt</button>
          <button class="btn btn-ghost" style="font-size:12px;padding:7px 14px;" onclick="location.reload()">✕ Cancel</button>
        </div>
      </td>`;
    const container = tr.querySelector(".itemsContainer");
    (sale.Item_RP || []).forEach(i => addItemRow(null, container, i.barcode, i.price, i.qty));
    updateTotalLive(tr);
  };

  window.addItemRow = (btn, container, bc="", pr="", qty=1) => {
    const target = container || btn.previousElementSibling;
    const div = document.createElement("div");
    div.className = "item-row itemRow";
    div.innerHTML = `
      <input type="text" class="edit-input bc" value="${bc}" placeholder="Barcode">
      <input type="number" class="edit-input qtyInput" value="${qty}" placeholder="Qty">
      <input type="number" class="edit-input pr" value="${pr}" placeholder="Price">
      <small class="gst-tag gstTag"></small>
      <button class="btn btn-danger" style="padding:4px 8px;font-size:11px;height:28px;align-self:center;" onclick="this.parentElement.remove(); updateTotalLive(this.closest('tr'))">✕</button>
    `;
    target.appendChild(div);

    const bcInp = div.querySelector(".bc");
    const prInp = div.querySelector(".pr");
    const gstTag = div.querySelector(".gstTag");
    let mrp = parseFloat(pr) || 0;

    function updateGstTag() {
      const rate = getGstRate(bcInp.value.trim());
      const price = parseFloat(prInp.value) || 0;
      const discount = mrp - price;
      let tagHtml = '';
      if (rate && price) {
        const gstAmt = price - (price / (1 + rate / 100));
        tagHtml += `GST(${rate}%): ₹${gstAmt.toFixed(2)}`;
      } else if (rate) {
        tagHtml += `GST: ${rate}%`;
      }
      if (mrp && discount !== 0) {
        const discColor = discount < 0 ? "#1cc88a" : "#e74c3c";
        tagHtml += ` <span style="color:${discColor};display:block;">Disc: ₹${discount.toFixed(2)}</span>`;
      }
      gstTag.innerHTML = tagHtml;
    }

    bcInp.addEventListener("input", () => {
      const s = stockData.find(x => x.Barcode == bcInp.value.trim());
      if (s) { prInp.value = s.MRP; mrp = parseFloat(s.MRP) || 0; }
      updateGstTag();
      updateTotalLive(div.closest("tr"));
    });

    if (bc) updateGstTag();

    [div.querySelector(".qtyInput"), prInp].forEach(input => {
      input.addEventListener("input", () => {
        updateGstTag();
        updateTotalLive(div.closest("tr"));
      });
    });
  };

  window.updateTotalLive = (tr) => {
    let total = 0;
    tr.querySelectorAll(".itemRow").forEach(row => {
      total += (parseFloat(row.querySelector(".qtyInput").value) || 0) *
               (parseFloat(row.querySelector(".pr").value) || 0);
    });
    tr.querySelector(".invoiceCell").textContent = "₹" + total.toLocaleString();
  };

  window.saveSale = async (id, btn) => {
    const tr = btn.closest("tr");
    const newItems = [...tr.querySelectorAll(".itemRow")].map(r => ({
      barcode: r.querySelector(".bc").value.trim(),
      qty: parseFloat(r.querySelector(".qtyInput").value) || 0,
      price: parseFloat(r.querySelector(".pr").value) || 0
    }));

    const { data: oldSale } = await supabase.from("Sales").select("Item_RP").eq("id", id).single();
    const oldItems = oldSale ? oldSale.Item_RP : [];

    for (const newItem of newItems) {
      const s = stockData.find(x => x.Barcode == newItem.barcode);
      const oldQty = (oldItems.find(oi => oi.barcode === newItem.barcode) || {}).qty || 0;
      const { data: liveStock } = await supabase.from("Stock").select("QTY").eq("Barcode", newItem.barcode).single();
      const effectiveStock = (liveStock ? liveStock.QTY : 0) + oldQty;
      if (!s || effectiveStock < newItem.qty) {
        showWarning(`<strong>${s ? s.Item_Name : newItem.barcode}</strong><br>Available: ${effectiveStock} &nbsp;|&nbsp; Required: ${newItem.qty}`);
        return;
      }
      if (newItem.qty <= 0) {
        showWarning(`Quantity must be greater than 0 for:<br><strong>${s ? s.Item_Name : newItem.barcode}</strong>`);
        return;
      }
    }

    const restoreMap = {};
    for (const oi of oldItems) restoreMap[oi.barcode] = (restoreMap[oi.barcode] || 0) + oi.qty;
    const deductMap = {};
    for (const ni of newItems) deductMap[ni.barcode] = (deductMap[ni.barcode] || 0) + ni.qty;

    const allBarcodes = new Set([...Object.keys(restoreMap), ...Object.keys(deductMap)]);
    for (const bc of allBarcodes) {
      const net = (restoreMap[bc] || 0) - (deductMap[bc] || 0);
      if (net === 0) continue;
      const { data: cur } = await supabase.from("Stock").select("QTY").eq("Barcode", bc).single();
      await supabase.from("Stock").update({ QTY: cur.QTY + net }).eq("Barcode", bc);
    }

    const total = newItems.reduce((a, b) => a + b.price * b.qty, 0);
    await supabase.from("Sales").update({
      Sale_No: Number(tr.querySelector(".saleNoInput").value),
      Customer_Name: tr.querySelector(".customerInput").value,
      Item_RP: newItems,
      Invoice: total
    }).eq("id", id);

    const oldSale2 = salesData.find(s => s.id == id);
    const changeParts = [];
    if (Number(tr.querySelector(".saleNoInput").value) !== oldSale2.Sale_No)
      changeParts.push(`Sale_No:(${oldSale2.Sale_No}-->${tr.querySelector(".saleNoInput").value})`);
    if (tr.querySelector(".customerInput").value !== oldSale2.Customer_Name)
      changeParts.push(`Customer:(${oldSale2.Customer_Name}-->${tr.querySelector(".customerInput").value})`);
    if (total !== oldSale2.Invoice)
      changeParts.push(`Invoice:(${oldSale2.Invoice}-->${total})`);

    if (changeParts.length > 0) {
      await supabase.from("SaleEdits").insert([{
        sale_no: oldSale2.Sale_No,
        customer: oldSale2.Customer_Name,
        changes: changeParts.join(", "),
        action: "UPDATE"
      }]);
    }

    alert("Sale saved & stock updated!");
    await fetchData(); renderTable();
  };

  window.downloadInvoice = async (id, btn) => {
    const tr = btn.closest("tr");
    const customer = tr.querySelector(".customerInput").value || "Valued Customer";
    const saleNo = tr.querySelector(".saleNoInput").value || "N/A";

    const paint = prompt("Payment status? (type 'false' or 'not paid' if pending)");
    const paid = paint && (paint.toLowerCase() === "false" || paint.toLowerCase() === "not paid");
    const Pay = paid ? "Payment Pending" : "Paid";
    const statusColor = paid ? "#000" : "#000";

    const items = [...tr.querySelectorAll(".itemRow")].map(r => {
      const bc = r.querySelector(".bc").value.trim();
      const s = stockData.find(x => x.Barcode == bc);
      return {
        barcode: bc,
        hsn: s?.HSN || null,
        name: s ? s.Item_Name : bc,
        mrp: parseFloat(s?.MRP) || 0,
        qty: parseFloat(r.querySelector(".qtyInput").value) || 0,
        price: parseFloat(r.querySelector(".pr").value) || 0
      };
    });

    let grandTotal = 0, totalGst = 0, totalDiscount = 0;

    const rowsHtml = items.map(i => {
      const lineTotal = i.qty * i.price;
      grandTotal += lineTotal;
      const gstRate = i.hsn ? parseFloat(hsnGstMap[String(i.hsn)]) || 0 : 0;
      const lineGst = lineTotal - (lineTotal / (1 + gstRate / 100));
      totalGst += lineGst;
      const lineMrp = i.qty * i.mrp;
      const lineDiscount = lineTotal - lineMrp;
      totalDiscount -= lineDiscount;

      return `
        <tr style="border-bottom:1px dotted #000;">
          <td style="padding:4px 0; text-align:left; font-size:12px; font-weight:600; color:#000;">
            ${i.name}
          </td>
          <td style="padding:4px 0; text-align:center; font-size:12px; font-weight:600; color:#000;">${i.qty}</td>
          <td style="padding:4px 0; text-align:right; font-size:12px; font-weight:600; color:#000;">
            ${i.mrp !== i.price ? `<span style="text-decoration:line-through;color:#000;font-size:10px;font-weight:700;">₹${i.mrp.toFixed(2)}</span><br>` : ''}
            ₹${i.price.toFixed(2)}
          </td>
          <td style="padding:4px 0; text-align:right; font-size:12px; font-weight:600; color:#000;">
            ₹${lineTotal.toFixed(2)}
            ${gstRate ? `<br><span style="font-size:10px;color:#000;font-weight:700;">GST(${gstRate}%): ₹${lineGst.toFixed(2)}</span>` : ''}
          </td>
        </tr>`;
    }).join("");

    const subtotal = grandTotal - totalGst;

    const element = document.createElement('div');
    element.innerHTML = `
      <div style="width:67mm; font-family:'Poppins',sans-serif; color:#000; font-size:13px; font-weight:500;">
        <div style="text-align:center; border-bottom:2px dashed #000; padding-bottom:8px; margin-bottom:8px;">
          <div style="font-weight:800; font-size:16px; color:#000;">INVOICE #SALE-${saleNo}</div>
          <div style="color:#000; font-size:11px; font-weight:600;">${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString()}</div>
        </div>
        <div style="border-bottom:2px dashed #000; padding-bottom:6px; margin-bottom:6px; font-size:12px; font-weight:600;">
          <div><b>Billed To:</b> ${customer}</div>
          <div><b>Status:</b> <span style="color:${statusColor};font-weight:800;">${Pay}</span></div>
        </div>
        <table style="width:100%; border-collapse:collapse; font-size:12px;">
          <thead>
            <tr style="border-bottom:2px solid #000;">
              <th style="padding:4px 0; text-align:left; font-size:11px; font-weight:800;">Item</th>
              <th style="padding:4px 0; text-align:center; font-size:11px; font-weight:800;">Qty</th>
              <th style="padding:4px 0; text-align:right; font-size:11px; font-weight:800;">Price</th>
              <th style="padding:4px 0; text-align:right; font-size:11px; font-weight:800;">Total</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
        <div style="border-top:2px dashed #000; margin-top:6px; padding-top:6px; font-size:12px; font-weight:600;">
          <div style="display:flex; justify-content:space-between;">
            <span>Subtotal (excl. GST):</span><span>₹${subtotal.toFixed(2)}</span>
          </div>
          ${totalDiscount !== 0 ? `<div style="display:flex; justify-content:space-between;">
            <span>Discount:</span><span>₹${totalDiscount.toFixed(2)}</span>
          </div>` : ''}
          <div style="display:flex; justify-content:space-between;">
            <span>Total GST:</span><span>₹${totalGst.toFixed(2)}</span>
          </div>
          <div style="display:flex; justify-content:space-between; font-weight:800; font-size:15px; border-top:2px dashed #000; margin-top:4px; padding-top:4px;">
            <span>Grand Total:</span><span>₹${grandTotal.toFixed(2)}</span>
          </div>
        </div>
        <div style="text-align:center; margin-top:12px; border-top:2px dashed #000; padding-top:8px; font-size:11px; color:#000; font-weight:600;">
          <div style="font-weight:800; font-size:13px; margin-bottom:4px;">Thank you for shopping with us!</div>
          <div>Evergreen Golf | Premium Golf Equipment</div>
          <div>Unit no 5, Sevaganapalli Village & Post,</div>
          <div>Hosur Taluk, Krishnagiri District</div>
          <div>GST: 33AQQPS0101C1ZD</div>
          <div style="margin-top:8px; font-size:10px; font-weight:700; border-top:1px solid #000; padding-top:6px;">No return or exchange. Subject to Tamil Nadu jurisdiction.</div>
          <div style="margin-top:20px;">&nbsp;</div>
        </div>
      </div>`;
    const win = window.open('', '_blank', 'width=400,height=700,scrollbars=yes');
    win.document.write(`<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Invoice #SALE-${saleNo}</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 20px; background: #f5f5f5; display: flex; justify-content: center; }
    .receipt { width: 67mm; font-family: 'Poppins', sans-serif; background: #fff; padding: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
    @media print { body { background: #fff; padding: 0; } .receipt { box-shadow: none; } .no-print { display: none; } }
    .print-btn { display: block; margin: 16px auto 0; padding: 8px 24px; background: #3aad70; color: #fff; border: none; border-radius: 6px; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
    .print-btn:hover { background: #2e8f5a; }
  </style>
</head>
<body>
  <div>
    <div class="receipt">${element.innerHTML}</div>
    <button class="print-btn no-print" onclick="window.print()">🖨️ Print</button>
  </div>
</body>
</html>`);
    win.document.close();
  };

  window.showWarning = (msg) => {
    document.getElementById("warningText").innerHTML = msg;
    document.getElementById("warningModal").style.display = "block";
    document.getElementById("overlay").style.display = "block";
  };
  window.closeWarning = () => {
    document.getElementById("warningModal").style.display = "none";
    document.getElementById("overlay").style.display = "none";
  };

  document.getElementById("addSaleBtn").onclick = async () => {
    const { data } = await supabase.from("Sales").insert([{ Sale_No: 1, Item_RP: [], Invoice: 0, Customer_Name: "" }]).select().single();
    await fetchData(); renderTable(); enterEditMode(data.id);
  };

  await Promise.all([fetchData(), loadHsnData()]);
  renderTable();
});
</script>
</body>
</html>
